<style>
/* Layout : application plein écran en trois colonnes (arborescence | fiche | sortie CCTP/DPGF/offres), empilées sur écran étroit */
:root{
  --bg:#e9ecef; --panel:#f3f5f7; --soft:#f7f8fa; --ink:#1b2430; --muted:#5b6674; --line:#d3d9e0; --line-soft:#e6eaee;
  --accent:#0050c8; --accent-ink:#ffffff; --accent-soft:#e8eefb; --danger:#a3361c; --danger-soft:#f7e6e1; --paper:#ffffff;
  --ok:#2c6e3f; --ok-soft:#e0efe4; --warn:#8a5a00; --warn-soft:#fbefd5; --orange:#b85a0c; --orange-soft:#fbe9d8; --s-ok:#22b455; --s-orange:#ff8c1a; --s-red:#ef4444; --s-grey:#a3abb5; --bg-ok:#bdffd0; --bg-orange:#ffe7d2; --bg-red:#fbbcbc; --note:#fff8d6; --note-line:#eadb8c; --note-ink:#6b5300; --ph:#8a94a0;
  --f-body:"Archivo", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-label:"Archivo Narrow", "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-mono:"Archivo", -apple-system, "Segoe UI", Arial, sans-serif; /* chiffres tabulaires plutôt qu'une police mono */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --panel:#181d23; --soft:#1b2128; --ink:#e4e8ed; --muted:#94a0ad; --line:#2b333c; --line-soft:#222930;
  --accent:#6ea0ff; --accent-ink:#0b1a33; --accent-soft:#17243c; --danger:#e58a72; --danger-soft:#3a221c; --paper:#1d232a;
  --ok:#7cc493; --ok-soft:#1a2e21; --warn:#e2b55a; --warn-soft:#352a12; --orange:#f0a35a; --orange-soft:#3a2614; --s-ok:#3ddc84; --s-orange:#ffa54a; --s-red:#ff6b6b; --s-grey:#6b7682; --bg-ok:#1a2a20; --bg-orange:#2e251b; --bg-red:#33201f; --note:#2c2815; --note-line:#4a4222; --note-ink:#e2c96a; --ph:#7c8794; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --panel:#181d23; --soft:#1b2128; --ink:#e4e8ed; --muted:#94a0ad; --line:#2b333c; --line-soft:#222930;
  --accent:#6ea0ff; --accent-ink:#0b1a33; --accent-soft:#17243c; --danger:#e58a72; --danger-soft:#3a221c; --paper:#1d232a;
  --ok:#7cc493; --ok-soft:#1a2e21; --warn:#e2b55a; --warn-soft:#352a12; --orange:#f0a35a; --orange-soft:#3a2614; --s-ok:#3ddc84; --s-orange:#ffa54a; --s-red:#ff6b6b; --s-grey:#6b7682; --bg-ok:#1a2a20; --bg-orange:#2e251b; --bg-red:#33201f; --note:#2c2815; --note-line:#4a4222; --note-ink:#e2c96a; --ph:#7c8794; color-scheme:dark}

[hidden]{display:none!important}
body{font-variant-numeric:tabular-nums}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandrow{display:flex;align-items:baseline;gap:14px;flex:1 1 420px;min-width:0}
.brand{display:flex;align-items:baseline;gap:7px;flex:none}
.brand img{height:36px;width:26px;display:block;margin-bottom:-3px;position:relative;top:5px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 0 3px rgba(255,255,255,.18))}}
:root[data-theme="dark"] .brand img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 0 3px rgba(255,255,255,.18))}
.brand span{font-family:var(--f-body);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--ink);line-height:1}
.brandrow .proj{align-items:baseline}
.ab-logo{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border-radius:6px;padding:6px 16px 10px;margin:-4px 0 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ab-logo{background:#ffffff}}
:root[data-theme="dark"] .ab-logo{background:#ffffff}
.ab-logo img{width:220px;height:auto;display:block}
.ab-logo span{font-family:var(--f-body);font-weight:300;font-size:15px;letter-spacing:.14em;color:#4b4221;line-height:1}
.proj{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
#p-nom{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;min-width:120px;max-width:100%;font-weight:600;font-size:15px;flex:0 1 auto}
#p-nom:hover,#p-nom:focus{border-color:var(--line);background:var(--panel)}
.p-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.p-meta .dirty{color:var(--warn)}
.p-meta .tagphase{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.top-actions .sep{width:1px;background:var(--line);margin:0 4px}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:300px 10px minmax(0,1fr) 10px 560px;gap:0}
.split{cursor:col-resize;position:relative;touch-action:none;outline:none}
.split::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;border-radius:2px;background:transparent;transition:background .15s}
.split:hover::after,.split:focus-visible::after,.split.drag::after{background:var(--accent)}
.split.off{cursor:default;pointer-events:none}
.colhide{border:0;background:none;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.colhide:hover{background:var(--line-soft);color:var(--ink)}
.col .vbar{display:none}
.col.folded>*{display:none}
.col.folded>.vbar{display:flex;flex:1;border:0;background:none;cursor:pointer;flex-direction:column;align-items:center;gap:10px;padding:12px 0;color:var(--muted);font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.col.folded>.vbar span{writing-mode:vertical-rl;transform:rotate(180deg)}
.col.folded>.vbar:hover{color:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.col-h h2{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600;flex:1}
.col-b{flex:1;overflow:auto;min-height:0}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line);color:inherit}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:0 6px;font-size:11px;cursor:pointer;color:var(--muted);font-family:var(--f-mono);line-height:18px}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}

/* Arborescence */
.tree-tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
ul.tree{list-style:none;margin:0;padding:6px 0}
ul.tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;padding:4px 10px 4px calc(10px + var(--d,0) * 16px);cursor:pointer;border-top:2px solid transparent;border-bottom:2px solid transparent;user-select:none}
.row:hover{background:var(--line-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.row.msel{background:var(--accent-soft)!important;box-shadow:inset 3px 0 0 var(--accent)}
.row.msel.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.row .car{width:14px;flex:none;color:var(--muted);font-size:10px;text-align:center;border:0;background:none;padding:0;cursor:pointer}
.row .num{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.g .nm{font-family:var(--f-label);font-weight:600;letter-spacing:.01em}
.row.g0 .nm{text-transform:uppercase;font-size:12.5px;letter-spacing:.04em}
.row .amt{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row.p .dot{width:9px;height:9px;flex:none;margin:0 3px;background:transparent!important}
.row .note{flex:none;color:var(--muted);display:inline-flex}
.row mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.tree-search{padding:6px 12px;border-bottom:1px solid var(--line-soft)}
.tree-search input{width:100%;border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--soft);font-size:13px}
.notebox textarea{background:var(--warn-soft)!important;border-color:var(--line)}
.coefhint{font-size:12px;color:var(--muted)}
.dpgf td.tv{text-align:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.dpgf td.tv.x{color:var(--ink);font-weight:600}
.dpgf tr.tvr td{color:var(--muted);font-size:12px;border-bottom:0;padding-top:2px;padding-bottom:2px}
.dpgf tr.ttcl td{font-weight:600;border-bottom:1px solid var(--line)}
.dpgf tr.ratio td{color:var(--muted);font-size:12px}
.nomrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,32%);gap:10px;align-items:start}
@media (max-width:560px){.nomrow{grid-template-columns:1fr}}
.oldp{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-label);font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:0 7px;line-height:17px;white-space:nowrap}
.oldhint{font-size:12px;color:var(--warn);margin-top:4px}
.idea{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;line-height:1;text-decoration:none;flex:none;cursor:pointer}
.idea:hover{border-color:var(--accent);background:var(--accent-soft)}
.finchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.dpgf td.fin{font-size:12.5px}
.xcheck{border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px}
.xcheck.ok{color:var(--ok);border-color:var(--line-soft)}
.xcheck summary{cursor:pointer;font-weight:600;color:var(--warn)}
.xcheck .grp{margin-top:8px}
.xcheck .grp b{font-family:var(--f-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xcheck ul{list-style:none;margin:2px 0 0;padding:0;max-height:150px;overflow:auto}
.xcheck li button{all:unset;cursor:pointer;display:block;padding:2px 4px;border-radius:3px;width:100%;box-sizing:border-box}
.xcheck li button:hover{background:var(--accent-soft)}
.xcheck li .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.recents{display:flex;flex-direction:column;gap:4px}
.recent{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px}
.recent .rb{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column}
.recent .rb:hover b{color:var(--accent)}
.recent small{color:var(--muted);overflow-wrap:anywhere}
.recent.miss{opacity:.6}
.recent.miss small{color:var(--danger)}
.upd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:13px}
.upd b{color:var(--accent)}
.hist{display:flex;gap:2px}
.hist .btn{padding:4px 7px;display:inline-flex;align-items:center}
.row.st-validee{background:var(--bg-ok)}.row.p.st-validee .dot{background:var(--s-ok)}
.row.st-relecture{background:var(--bg-orange)}.row.p.st-relecture .dot{background:var(--s-orange)}
.row.st-reviser{background:var(--bg-red)}.row.p.st-reviser .dot{background:var(--s-red)}.row.p.st-reviser .nm{font-weight:600}
.row.st-validee:hover,.row.st-relecture:hover,.row.st-reviser:hover{filter:brightness(.97)}
.row.st-validee .amt,.row.st-relecture .amt,.row.st-reviser .amt,.row.st-validee .num,.row.st-relecture .num,.row.st-reviser .num{color:var(--ink);opacity:.7}
.tree-stat button{border:1px solid transparent;background:none;border-radius:999px;padding:1px 8px 1px 6px;font:inherit;color:inherit;cursor:pointer;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.tree-stat button:hover{border-color:var(--line)}
.tree-stat button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:600}
.tree-stat button:disabled{opacity:.5;cursor:default}
.tree-filter{padding:6px 12px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid var(--line-soft)}
.tree-stat{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.tree-stat .stat-sub{margin-left:auto;font-size:11px;color:var(--muted);padding-left:6px;white-space:nowrap}
.tree-stat span{display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.tree-stat i,.et i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-redaction{background:var(--s-grey)}.c-relecture{background:var(--s-orange)}.c-validee{background:var(--s-ok)}.c-reviser{background:var(--s-red)}
.tree-stat i,.et i{width:9px;height:9px}
.et-meta{font-size:12px;color:var(--muted);margin-top:-6px}
.etat{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.etat .lab{margin-right:4px}
.et{border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;background:var(--paper);display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.et:hover{border-color:var(--muted)}
.et[aria-checked="true"]{font-weight:600}
.et-redaction[aria-checked="true"]{background:var(--bg);border-color:var(--muted)}
.et-relecture[aria-checked="true"]{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.et-validee[aria-checked="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.et-reviser[aria-checked="true"]{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.phr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.phr .mini{font-family:var(--f-body);font-size:11.5px;line-height:20px;padding:0 8px}
.phr select{border:1px solid var(--line);border-radius:3px;background:var(--paper);font-size:11.5px;padding:1px 4px;max-width:220px}
.vtag{color:var(--accent)!important;background:var(--accent-soft)!important}
.pse{font-family:var(--f-label);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:0 4px;flex:none}
.row.drop-before{border-top-color:var(--accent)}
.row.drop-after{border-bottom-color:var(--accent)}
.row.drop-in{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.row.dragging{opacity:.4}
.tree-hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}

/* Fiche */
.fiche{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.fiche-title{display:flex;align-items:baseline;gap:10px}
.fiche-title .num{font-family:var(--f-mono);color:var(--accent);font-size:17px;font-weight:700}
.fiche-title h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 12px;background:var(--bg);border-radius:4px;font-size:13px;margin:0}
.ro dt{font-family:var(--f-label);color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.ro dd{margin:0;min-width:0;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab,.f>label{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.fiche .f>label,.fiche .lab{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.08em}
.fiche .f>label .link,.fiche .lab .link{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
.fs{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.fs-h{margin:0;font-family:var(--f-label);font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:baseline;gap:10px}
.fs-h small{font-family:var(--f-body);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.ftab{border:0;background:none;padding:7px 12px;font-family:var(--f-label);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.ftab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ftab .cnt{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px;letter-spacing:0}
.fpane{display:flex;flex-direction:column;gap:14px}
.f textarea.cl{min-height:64px}
.f input[type=text],.f input[type=number],.f select,.f textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--paper);width:100%;min-width:0}
.f textarea{resize:vertical;min-height:84px;line-height:1.45}
.f input.numin{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.f input.locked{background:var(--bg);color:var(--muted);cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--danger)}
.qres{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:18px;font-size:12px;color:var(--muted)}
.qres b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.libhint{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.libhint .dotc{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.libhint.mod .dotc{background:var(--warn)}
.libhint.new .dotc{background:var(--accent)}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% - 18px);margin-top:2px;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:20;max-height:300px;overflow:auto}
.ac-item{padding:6px 9px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.ac-item.on,.ac-item:hover{background:var(--accent-soft)}
.ac-item .n{min-width:0}
.ac-item .m{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ac-item .l{grid-column:1/-1;font-family:var(--f-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ac-item mark{background:none;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .niv{font-family:var(--f-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%;margin-top:4px}
.chips .niv:first-child{margin-top:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--paper);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .hint{color:inherit;opacity:.8}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.fin{display:flex;gap:10px;align-items:center}
.fin input[type=text]{flex:1}
.fin input:disabled{opacity:.5}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.total b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px 24px;color:var(--muted);text-align:center;max-width:60ch;margin:0 auto}
.ql{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.ql-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ql-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px 136px;align-items:center;gap:6px}
.ql-row .ln{min-width:0;overflow-wrap:anywhere}
.ql-row .ln small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql-row input{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--panel);font-family:var(--f-mono);text-align:right;width:100%;min-width:0}
.ql-row input.bad{border-color:var(--danger)}
.ql-row .u{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ql-row .qm{display:flex;gap:4px}
.ql-sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.ql-sum b{font-family:var(--f-mono);text-align:right}

/* Fiche prestation (refonte) : onglets, zone descriptive blanche, bande d'état, zone quantitative grise */
.fx{display:flex;flex-direction:column;min-height:100%}
.fx-tabs{display:flex;align-items:flex-end;padding:8px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.fx-tab{border:1px solid transparent;border-radius:6px 6px 0 0;background:none;padding:8px 14px;font-family:var(--f-label);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.fx-tab:hover{color:var(--ink)}
.fx-tab[aria-selected="true"]{background:var(--paper);border-color:var(--line);border-bottom-color:var(--paper);margin-bottom:-1px;color:var(--ink)}
.fx-tab[data-ft="notes"][aria-selected="true"]{background:var(--note);border-bottom-color:var(--note)}
.fx-tab .cnt{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px;letter-spacing:0}
.fx-tab .ndot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.fx-white{background:var(--paper);padding:26px 26px 28px;display:flex;flex-direction:column;gap:20px;position:relative}
.fx-share{position:absolute;top:8px;right:8px;width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fx-share:hover{border-color:var(--accent);background:var(--accent-soft)}
.fx-title{text-align:center;display:flex;flex-direction:column;gap:4px;padding:0 40px 6px}

.cctp .c-art h4{margin:0;font-size:13.5px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.c-body{margin:4px 0 0 76px}
.c-body>p:not(.cla):not(.clg):not(.c-meta){text-align:justify}
.c-gen{margin:12px 0 0 76px;background:var(--bg);padding:10px 14px;border-radius:3px}
.c-gen .gt{font-family:var(--f-label);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.c-gen .gst{font-weight:700;font-size:12.5px;margin:6px 0 2px}
.cctp .c-meta{font-size:12px;color:var(--muted);margin:6px 0 0}
.cctp .c-meta b{color:var(--ink);font-weight:600}
.cctp .cll{display:inline-block;width:24px;text-indent:0}
.cctp h1{font-size:18px;margin:0 0 2px;text-wrap:balance}
.cctp .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.cctp h2{font-family:var(--f-label);font-size:14px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin:26px 0 10px}
.cctp h3{font-size:14px;margin:18px 0 6px;font-weight:600}
.cctp .art{margin:10px 0 14px;cursor:pointer;border-radius:3px}
.cctp .art:hover{background:var(--line-soft)}
.cctp .art.sel{background:var(--accent-soft)}
.cctp h4{font-size:13.5px;margin:0 0 3px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cctp h4 span.nr,.cctp h3 span{font-family:var(--f-mono);font-weight:500;margin-right:8px;color:var(--muted)}
.cctp h4 span.nr{margin-right:0}
.cctp p{margin:0 0 4px;white-space:pre-line}
.cctp .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.cctp .clg{font-weight:700;font-style:italic;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.cctp .cla{margin:0 0 3px;padding-left:24px;text-indent:-24px;font-size:13px}
.cctp .cla b{font-weight:600}
table.cats{border-collapse:collapse;width:100%;font-size:13px}
.cats th{text-align:left;font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.cats td{padding:4px 6px;border-bottom:1px solid var(--line-soft)}
.cats input{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--paper);width:100%;min-width:0}
.cats th.r{text-align:right}
.cats td.u{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.cats td.act{white-space:nowrap;text-align:right}
.cats select{border:1px solid var(--line);border-radius:4px;padding:3px 6px;background:var(--paper)}
.cctp .meta b{color:var(--ink);font-weight:500}
.cctp .intro{font-style:italic;color:var(--muted)}
.cctp .lotref{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 3px}
.lotbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.tblwrap{overflow-x:auto;padding:0 0 30px}
table.dpgf{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.dpgf th{position:sticky;top:0;background:var(--panel);font-family:var(--f-label);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--ink);z-index:1}
.dpgf td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.dpgf .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dpgf .c{text-align:center}
.dpgf .n{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.dpgf tr.lot td{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--bg);padding-top:8px}
.dpgf tr.psehead td{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--warn-soft);color:var(--warn);padding-top:8px}
.dpgf tr.grp td{font-weight:600}
.dpgf tr.art{cursor:pointer}
.dpgf.hier tr.art td{border-bottom:0}
.dpgf.hier tr.art.z td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.dpgf.hier tr.grp td{border-bottom:1px solid var(--line);padding-top:9px}
.dpgf.hier tr.gst td{color:var(--muted);font-style:italic;border-top:1px solid var(--line);border-bottom:0;padding-bottom:10px}
.dpgf.hier tr.gst td:first-child{border-top:0}
.dpgf tr.art:hover td{background:var(--line-soft)}
.dpgf tr.art.sel td{background:var(--accent-soft)}
.dpgf tr.st td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
.dpgf tr.tot td{font-weight:600;font-size:13.5px}
.dpgf tr.ttc td{font-weight:600;font-size:14px;border-top:1.5px solid var(--ink)}
.dpgf .zero{color:var(--danger)}
.dpgf .tag{font-family:var(--f-label);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dpgf select{border:1px solid var(--line);border-radius:3px;background:var(--paper);padding:1px 4px;font-family:var(--f-mono);font-size:12px}
.dpgf td.best{background:var(--ok-soft)}
.dpgf .ec{display:block;font-size:11px}
.ec.lo{color:var(--danger)} .ec.hi{color:var(--warn)} .ec.eq{color:var(--muted)}
.dpgf td.miss{background:var(--danger-soft);color:var(--danger);text-align:center;font-family:var(--f-label);font-size:11px}
.dpgf td.flag-lo{box-shadow:inset 3px 0 0 var(--danger)}
.dpgf td.flag-hi{box-shadow:inset 3px 0 0 var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.offchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--paper)}
.offchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0 6px}
.offchip button:hover{color:var(--accent)}

/* Fenêtres */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,24,.45)}
.dlg{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.3);width:min(580px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column}
.dlg.wide{width:min(1060px,100%);height:min(760px,calc(100% - 32px))}
.dlg-h{padding:16px 20px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:12px}
.dlg-h h3{margin:0;font-size:16px;flex:1}
.dlg-b{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.dlg fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.dlg legend{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;background:var(--paper)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.optrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lotlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--paper);max-height:240px;overflow:auto}
.lotlist label{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lotlist label:last-child{border-bottom:0}
.lotlist .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lotlist .a{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.recap-opt{border-top:1.5px solid var(--line)}
.x-sum{font-size:12.5px;color:var(--muted);margin-right:auto}
.libloc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.libloc .dotc{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.libloc .dotc.bad{background:var(--danger)}
.lib{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px;min-height:0;flex:1}
.lib-list{border:1px solid var(--line);border-radius:4px;overflow:auto;background:var(--paper);min-height:0}
.lib-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib-tools input,.lib-tools select{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--paper)}
.lib-tools input{flex:1 1 200px;min-width:0}
table.lt{border-collapse:collapse;width:100%;font-size:12.5px}
.lt th{position:sticky;top:0;background:var(--panel);text-align:left;font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);z-index:1}
.lt td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.lt tr.it{cursor:pointer}
.lt tr.it:hover td{background:var(--line-soft)}
.lt tr.it.on td{background:var(--accent-soft)}
.lt .r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.lt .lotc{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lib-edit{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
table.lieux{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.lieux th{text-align:left;font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.lieux td{padding:4px 6px;border-bottom:1px solid var(--line-soft)}
.lieux input{border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--paper);width:100%;min-width:0}
.lieux input.numin{font-family:var(--f-mono);text-align:right}
.lieux td.calc{font-family:var(--f-mono);text-align:right;color:var(--muted);white-space:nowrap}
.lieux td.act{white-space:nowrap}
.difflist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.difflist h4{margin:10px 0 4px;font-family:var(--f-label);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.difflist .d{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.difflist .d span:first-child{font-family:var(--f-mono);color:var(--muted)}
.difflist .d small{display:block;color:var(--muted)}
.idx-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.idx-list .ir{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.idx-list .ir:last-child{border-bottom:0}
.idx-list .ir b{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width: 1100px){
  html,body{height:auto}
  .app{height:auto}
  .cols{grid-template-columns:1fr!important;row-gap:10px}
  .split{display:none}
  .col.folded>.vbar{flex-direction:row;padding:10px 12px}
  .col.folded>.vbar span{writing-mode:horizontal-tb;transform:none}
  .col-b{max-height:75vh}
  .lib{grid-template-columns:1fr}
  .dlg.wide{height:calc(100% - 32px)}
}
@media (max-width: 480px){ .grid2,.optrow{grid-template-columns:1fr} .cctp{padding:16px} .ql-row{grid-template-columns:minmax(0,1fr) 100px} .ql-row .u,.ql-row .qm{grid-column:auto} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
/* ======================================================================

const CATS_DEF=["Fourniture et pose","Fourniture seule","Pose seule","Dépose / démolition","Préparation de support","Prestation forfaitaire","Essais et contrôles"];
let CATS=null,CATS_MAJ=0;
const APP_VERSION="0.14.1",GITHUB_REPO="caschauvin-star/prescrire";
const TAUX=[20,10,5.5];
/* Intitulé complet d'une prestation : nom + précision propre au projet (ex. « 120 x 220 ») */
const ttl=n=>{const a=(n.nom||"").trim(),b=(n.prec||"").trim();return b?(a?a+" "+b:b):a};
const fmtT=t=>String(t).replace(".",",")+" %";
const UNITES=["U","ens.","for.","m²","ml","m³","kg","h"];
const fixU=u=>u==="ft"?"for.":u;
/* Descriptif détaillé : alinéas ajoutés au CCTP à la suite du descriptif */
const CLAUSES=[

  delete s.db;

  walkP(s.tree,n=>{
    n.u=fixU(n.u);n.lieux=n.lieux||[];n.ql=n.ql||{};n.qlx=n.qlx||{};n.qx=n.qx||"";n.pse=!!n.pse;n.cl=clOf(n);n.etat=ETATS.some(e=>e[0]===n.etat)?n.etat:"redaction";

    if(n.lieux.length>1&&!Object.keys(n.ql).length){const q=num(n.qte),k=n.lieux.length;
      if(Number.isInteger(q)){const b=Math.floor(q/k);n.lieux.forEach((l,i)=>n.ql[l]=b+(i<q-b*k?1:0))}

  SNAP.forEach((k,id)=>{if(!seen.has(id))TOMB.push({id,maj:now})});resnap()}
function mergeLib(disk){
  const tomb=new Map();[...(disk.suppr||[]),...TOMB].forEach(t=>{if(!tomb.has(t.id)||tomb.get(t.id)<t.maj)tomb.set(t.id,t.maj)});
  const map=new Map();[...normBase(disk.articles||[]),...BASE].forEach(a=>{const c=map.get(a.id);if(!c||(a.maj||0)>=(c.maj||0))map.set(a.id,a)});
  const cutoff=Date.now()-120*864e5;
  const dc=Array.isArray(disk.categories)&&disk.categories.length&&(disk.catsMaj||0)>CATS_MAJ;
  return{categories:dc?disk.categories:catList(),catsMaj:dc?disk.catsMaj:CATS_MAJ,articles:[...map.values()].filter(a=>!(tomb.has(a.id)&&tomb.get(a.id)>=(a.maj||0))),suppr:[...tomb].filter(([,m])=>m>cutoff).map(([id,maj])=>({id,maj}))};
}
function applyMerge(m){const byId=new Map(BASE.map(a=>[a.id,a]));
  if(m.categories&&m.categories.length){CATS=m.categories;CATS_MAJ=m.catsMaj||0}
  BASE=m.articles.map(a=>{const l=byId.get(a.id);if(l){if(l!==a)Object.assign(l,a);return l}return a});resnap()}
const libDoc=m=>JSON.stringify({format:"prescrire-bibliotheque",version:9,categories:m.categories||catList(),catsMaj:m.catsMaj||CATS_MAJ,articles:m.articles,suppr:m.suppr});
function parseLib(txt){try{const d=JSON.parse(txt);return Array.isArray(d)?{articles:d,suppr:[]}:{articles:d.articles||[],suppr:d.suppr||[],categories:d.categories,catsMaj:d.catsMaj||0}}catch(e){return null}}
let sbT=null;
function saveBase(){stamp();clearTimeout(sbT);sbT=setTimeout(flushBase,T?400:50)}
async function flushBase(){
  sbT=null;
  if(!T){let disk={};try{disk=parseLib(localStorage.getItem(KEY_B)||"[]")||{}}catch(e){}
    const m=mergeLib(disk);applyMerge(m);TOMB=[];try{localStorage.setItem(KEY_B,libDoc(m))}catch(e){}return}
  if(!LIB_PATH)return;
  if(FLUSHING){FLUSH_AGAIN=true;return}
  FLUSHING=true;
  try{
    /* Lecture, fusion, écriture, puis relecture de contrôle : si un autre poste a écrit
       au même instant, on recommence pour ne perdre aucune modification. */
    for(let k=0;k<5;k++){
      const txt=await inv("read_text",{path:LIB_PATH}).catch(()=>null);
      const m=mergeLib(txt?parseLib(txt)||{}:{});applyMerge(m);
      await inv("write_text",{path:LIB_PATH,content:libDoc(m)});
      await new Promise(r=>setTimeout(r,150+Math.random()*350));
      const back=parseLib(await inv("read_text",{path:LIB_PATH}).catch(()=>"")||"");
      if(back&&covers(back)){TOMB=[];break}
    }
    LIB_MTIME=await inv("mtime",{path:LIB_PATH})||0;LIB_ERR="";
  }catch(e){LIB_ERR=String(e);toast("La bibliothèque partagée n'a pas pu être enregistrée : "+LIB_ERR,6000)}
  FLUSHING=false;libStatus();
  if(FLUSH_AGAIN){FLUSH_AGAIN=false;flushBase()}
}
let FLUSHING=false,FLUSH_AGAIN=false;
function covers(d){const dm=new Map((d.articles||[]).map(a=>[a.id,a.maj||0])),ds=new Set((d.suppr||[]).map(t=>t.id));
  return BASE.every(a=>dm.has(a.id)&&dm.get(a.id)>=(a.maj||0))&&TOMB.every(t=>ds.has(t.id))}
async function reloadLib(force){
  if(!T||!LIB_PATH||sbT||FLUSHING)return;
  try{const mt=await inv("mtime",{path:LIB_PATH});if(!force&&(!mt||mt===LIB_MTIME))return;
    const txt=await inv("read_text",{path:LIB_PATH});const d=parseLib(txt);if(!d)return;
    applyMerge(mergeLib(d));LIB_MTIME=mt||0;LIB_ERR="";
    if(!covers(d))flushBase();
    if($("#lb-list"))libList();const n=S.sel&&IDX[S.sel]&&IDX[S.sel].n;if(n&&n.kind==="p")libHint(n);libStatus();
  }catch(e){LIB_ERR=String(e);libStatus()}
}

/* ======================================================================
   Index de l'arbre et totaux
   ====================================================================== */
let IDX={};
function reindex(){
  IDX={};
  /* variantes : on écarte d'abord les rattachements devenus invalides (prestation déplacée dans un autre lot, variante supprimée) */
  S.tree.forEach(l=>{if(l.kind!=="g")return;const vs=varsOf(l),ids=new Set(vs.map(v=>v.id));
    walkP(l.children,n=>{if(n.vid&&!ids.has(n.vid))delete n.vid;if(n.vid)n.pse=false});
    if(vs.length){const base=new Set(flatP([l]).filter(n=>!n.vid).map(n=>n.id));vs.forEach(v=>{v.rempl=(v.rempl||[]).filter(id=>base.has(id))})}});
  /* numérotation : les prestations de variante sont numérotées à part (03.V1.1…) pour que la base reste continue */
  (function walk(arr,parent,prefix,depth){let c=0;arr.forEach((n,i)=>{
    const isv=n.kind==="p"&&n.vid;if(!isv)c++;
    const nr=isv?"":prefix?prefix+"."+c:String(c).padStart(2,"0");
    IDX[n.id]={n,parent,arr,i,nr,depth};
    if(n.kind==="g")walk(n.children,n,nr,depth+1);
  })})(S.tree,null,"",0);
  S.tree.forEach(l=>{if(l.kind!=="g"||!l.vars||!l.vars.length)return;const counts={};
    walkP(l.children,n=>{if(!n.vid||!IDX[n.id])return;const k=l.vars.findIndex(v=>v.id===n.vid)+1;counts[k]=(counts[k]||0)+1;IDX[n.id].nr=IDX[l.id].nr+".V"+k+"."+counts[k]})});
}

const lineT=n=>num(n.qte)*num(n.prix);
/* Variantes exigées : l.vars=[{id,nom,rempl:[ids des prestations de base remplacées]}] ; une prestation de variante porte n.vid */
const baseT=n=>n.kind==="p"?(n.pse||n.vid?0:lineT(n)):n.children.reduce((s,c)=>s+baseT(c),0);
const pseT=n=>n.kind==="p"?(n.pse&&!n.vid?lineT(n):0):n.children.reduce((s,c)=>s+pseT(c),0);
const hasMode=(n,pse)=>n.kind==="p"?!n.vid&&!!n.pse===pse:n.children.some(c=>hasMode(c,pse));
const hasNonVar=n=>n.kind==="p"?!n.vid:n.children.some(hasNonVar);
const varsOf=l=>l&&l.kind==="g"?(l.vars||(l.vars=[])):[];
const varItems=(l,v)=>flatP([l]).filter(n=>n.vid===v.id);
const varRempl=(l,v)=>flatP([l]).filter(n=>!n.vid&&!n.pse&&(v.rempl||[]).includes(n.id));
const varT=(l,v)=>varItems(l,v).reduce((s,n)=>s+lineT(n),0);
const varRemplT=(l,v)=>varRempl(l,v).reduce((s,n)=>s+lineT(n),0);
const vNum=(l,v)=>varsOf(l).indexOf(v)+1;
const vLabel=(l,v)=>"Variante n° "+vNum(l,v)+((v.nom||"").trim()?" — "+v.nom.trim():"");
const pmvTxt=d=>(d>=0?"Plus-value":"Moins-value");
function varOfP(n){const r=IDX[n.id]?rootOf(n.id):null;return r?varsOf(r).find(v=>v.id===n.vid)||null:null}
const ancestors=id=>{const a=[];let p=IDX[id]&&IDX[id].parent;while(p){a.unshift(p);p=IDX[p.id].parent}return a};
const isDesc=(id,anc)=>{let p=IDX[id]&&IDX[id].parent;while(p){if(p.id===anc)return true;p=IDX[p.id].parent}return false};
const countP=n=>n.kind==="p"?1:n.children.reduce((s,c)=>s+countP(c),0);
const rootOf=id=>{const a=ancestors(id);return a.length?a[0]:IDX[id].n};
const lotRef=n=>{const l=rootOf(n.id);return "Lot "+IDX[l.id].nr+" — "+l.nom};
const flatP=arr=>{const o=[];walkP(arr,n=>o.push(n));return o};

/* ======================================================================
   Lieux et quantités (formules : S surface, P périmètre, H hauteur)
   ====================================================================== */
const LO=name=>S.lieux.find(l=>l.nom===name);
const isExpr=s=>/[^\d.,\s]/.test(String(s??""));
function evalQ(expr,lieu){
  let e=String(expr??"").replace(/\s+/g,"");if(!e)return{v:0};
  e=e.replace(/,/g,".").replace(/[x×]/g,"*").replace(/÷/g,"/");
  const names={s:"la surface",p:"le périmètre",h:"la hauteur"};
  try{
    e=e.replace(/[SPH]/gi,m=>{const k=m.toLowerCase();
      if(!lieu)throw new Error("S, P et H ne s'utilisent qu'avec un lieu précis");
      const li=LO(lieu),v=li?num(li[k]):0;
      if(!v)throw new Error(`Renseignez ${names[k]} de « ${lieu} » (bouton Lieux)`);
      return "("+v+")"});
  }catch(err){return{v:0,err:err.message}}
  if(!/^[0-9.+\-*/()]+$/.test(e))return{v:0,err:"Formule non reconnue"};
  try{const v=Function('"use strict";return('+e+")")();if(!isFinite(v))return{v:0,err:"Formule incomplète"};return{v:r2(v)}}
  catch(x){return{v:0,err:"Formule incomplète"}}
}
function syncQ(n){if(n.lieux.length>1)n.qte=r2(n.lieux.reduce((s,l)=>s+num(n.ql[l]),0))}
function qOf(n,l){return n.lieux.length>1?num(n.ql[l]):num(n.qte)}
function recalc(n){
  if(n.lieux.length>1){n.lieux.forEach(l=>{if(n.qlx[l]){const r=evalQ(n.qlx[l],l);if(!r.err)n.ql[l]=r.v}});syncQ(n)}
  else if(n.qx){const r=evalQ(n.qx,n.lieux[0]);if(!r.err)n.qte=r.v}
}
function recalcAll(){walkP(S.tree,recalc)}
function setQ(n,raw){
  if(isExpr(raw)){n.qx=raw;const r=evalQ(raw,n.lieux[0]);if(!r.err)n.qte=r.v;return r}
  n.qx="";n.qte=raw.trim()===""?"":num(raw);return{v:n.qte};
}
function setQL(n,l,raw){
  let r;
  if(isExpr(raw)){n.qlx[l]=raw;r=evalQ(raw,l);if(!r.err)n.ql[l]=r.v}
  else{delete n.qlx[l];n.ql[l]=num(raw);r={v:n.ql[l]}}
  syncQ(n);return r;
}
function toggleLieu(n,l){
  const before=n.lieux.length;
  if(n.lieux.includes(l)){
    n.lieux=n.lieux.filter(z=>z!==l);delete n.ql[l];delete n.qlx[l];
    if(n.lieux.length===1){const k=n.lieux[0];n.qte=num(n.ql[k]);n.qx=n.qlx[k]||""}else if(n.lieux.length>1)syncQ(n);
  }else{
    if(before===1){const k=n.lieux[0];n.ql[k]=num(n.qte);if(n.qx)n.qlx[k]=n.qx;else delete n.qlx[k]}
    const order=S.lieux.map(z=>z.nom);
    n.lieux=[...n.lieux,l].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    if(n.lieux.length>1){if(n.ql[l]==null)n.ql[l]=0;syncQ(n)}
    else if(before===0&&n.qx)recalc(n);
  }
}
function locTxt(n){return n.lieux.length>1?n.lieux.map(l=>`${l} (${qf.format(qOf(n,l))} ${n.u})`).join(", "):n.lieux.join(", ")}
function dimTxt(li){if(!li)return"";const a=[];if(num(li.s))a.push("S "+qf.format(num(li.s)));if(num(li.p))a.push("P "+qf.format(num(li.p)));if(num(li.h))a.push("H "+qf.format(num(li.h)));return a.join(" · ")}
function qBtns(lieu,target){const li=LO(lieu);if(!li)return"";let h="";
  if(num(li.s))h+=`<button class="mini" data-qins="S" data-qt="${esc(target)}" title="Surface au sol">sol</button>`;
  if(num(li.p)&&num(li.h))h+=`<button class="mini" data-qins="P*H" data-qt="${esc(target)}" title="Périmètre × hauteur">murs</button>`;
  if(num(li.p))h+=`<button class="mini" data-qins="P" data-qt="${esc(target)}" title="Périmètre (plinthes…)">pér.</button>`;
  return h}

/* ======================================================================
   Arborescence
   ====================================================================== */
/* État d'un lot : rouge si une prestation est à réviser, orange si une est à relire,
   vert si toutes sont validées, neutre sinon */
function grpState(g){const a=flatP([g]);if(!a.length)return"";const has=k=>a.some(n=>(n.etat||"redaction")===k);
  return has("reviser")?"reviser":has("relecture")?"relecture":a.every(n=>n.etat==="validee")?"validee":""}
const GRP_TITLE={reviser:"Contient une prestation à réviser",relecture:"Contient une prestation prête pour relecture",validee:"Toutes les prestations sont validées"};
let TQ="";
function renderTree(){
  reindex();
  const F=S.filtre||null,W=norm(TQ).split(/\s+/).filter(Boolean);
  const qm=n=>{const t=norm((IDX[n.id]?IDX[n.id].nr+" ":"")+ttl(n)+" "+(n.desc||"")+" "+(n.note||""));return W.every(w=>t.includes(w))};
  const okF=n=>!F||(n.etat||"redaction")===F;
  /* une prestation est montrée si elle passe le filtre d'état et la recherche (ou si un lot parent correspond) */
  const keep=(n,par)=>n.kind==="p"?okF(n)&&(!W.length||par||qm(n)):n.children.some(c=>keep(c,par||(W.length&&qm(n))));
  const active=F||W.length;
  const rec=(arr,par)=>arr.filter(n=>!active||keep(n,par)).map(n=>{
    const x=IDX[n.id],g=n.kind==="g",closed=g&&!active&&S.open[n.id]===false,pm=par||(W.length&&g&&qm(n));
    const amt=g?baseT(n):lineT(n),gs=g?grpState(n):"";
    return `<li><div class="row ${g?"g "+(gs?"st-"+gs:""):"p st-"+(n.etat||"redaction")} ${g&&x.depth===0?"g0":""} ${S.sel===n.id?"sel":""} ${MSEL.has(n.id)?"msel":""}" draggable="true" title="${esc(g?(GRP_TITLE[gs]||""):(ETATS.find(e=>e[0]===(n.etat||"redaction"))||ETATS[0])[1]+(n.note&&n.note.trim()?"\nNote : "+n.note.trim():""))}" data-id="${n.id}" style="--d:${x.depth}">`+
      (g?`<button class="car" data-tog="${n.id}" aria-label="${closed?"Déplier":"Replier"}">${closed?"▸":"▾"}</button>`:`<span class="dot"></span>`)+
      `<span class="num">${x.nr}</span><span class="nm">${W.length?hl((g?n.nom:ttl(n))||"Sans titre",W):esc((g?n.nom:ttl(n))||"Sans titre")}</span>${!g&&n.note&&n.note.trim()?'<span class="note" aria-label="Note interne"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"/></svg></span>':""}${!g&&n.pse?'<span class="pse">PSE</span>':""}${!g&&n.vid&&varOfP(n)?`<span class="pse vtag" title="${esc(vLabel(rootOf(n.id),varOfP(n)))}">V${vNum(rootOf(n.id),varOfP(n))}</span>`:""}<span class="amt">${amt?nf.format(amt):""}</span></div>`+
      (g&&!closed&&n.children.length?`<ul>${rec(n.children,pm)}</ul>`:"")+`</li>`;
  }).join("");
  $("#tree").innerHTML=rec(S.tree,false)||(active?`<li class="tree-hint">Aucune prestation ne correspond.</li>`:"");
  const all=flatP(S.tree),cnt=k=>all.filter(n=>(n.etat||"redaction")===k).length;
  $("#tree-stat").innerHTML=all.length?ETATS.map(([k,l])=>`<button data-filtre="${k}" aria-pressed="${F===k}" ${cnt(k)||F===k?"":"disabled"} title="${cnt(k)} ${{redaction:"en rédaction",relecture:"à relire",validee:"validée"+(cnt(k)>1?"s":""),reviser:"à réviser"}[k]} · ${F===k?"cliquer pour tout afficher":"cliquer pour n'afficher que celles-ci"}" aria-label="${cnt(k)} ${{redaction:"en rédaction",relecture:"à relire",validee:"validée"+(cnt(k)>1?"s":""),reviser:"à réviser"}[k]}"><i class="c-${k}"></i>${cnt(k)}</button>`).join(""):"";
  {const np=all.filter(n=>n.pse&&!n.vid).length,nv=all.filter(n=>n.vid).length;
    if(np||nv)$("#tree-stat").insertAdjacentHTML("beforeend",`<span class="stat-sub">dont ${[np?np+" en PSE":"",nv?nv+" en variante"+(nv>1?"s":""):""].filter(Boolean).join(" · ")}</span>`)}
  $("#tree-filter").hidden=!F;
  if(F)$("#tree-filter").innerHTML=`Filtre : ${esc((ETATS.find(e=>e[0]===F)||["",""])[1].toLowerCase())} · <button class="link" data-filtre="${F}">tout afficher</button>`;
}
$("#tq").addEventListener("input",e=>{TQ=e.target.value;renderTree()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-filtre]");if(!b||!b.closest("#tree-stat,#tree-filter"))return;
  S.filtre=S.filtre===b.dataset.filtre?null:b.dataset.filtre;persist();renderTree()});
$("#tree").addEventListener("click",e=>{
  const t=e.target.closest("[data-tog]");
  if(t){const id=t.dataset.tog;S.open[id]=S.open[id]===false;persist();renderTree();return}
  const r=e.target.closest(".row");if(!r)return;
  const id=r.dataset.id,n=IDX[id]&&IDX[id].n;
  if(n&&n.kind==="p"&&(e.metaKey||e.ctrlKey)){
    if(!MSEL.size&&S.sel&&IDX[S.sel]&&IDX[S.sel].n.kind==="p")MSEL.add(S.sel);
    MSEL.has(id)?MSEL.delete(id):MSEL.add(id);ANCH=id;
    if(MSEL.size<=1){const one=[...MSEL][0]||id;MSEL.clear();return select(one)}
    S.sel=id;renderTree();renderFiche();return}
  if(n&&n.kind==="p"&&e.shiftKey){
    const a=ANCH&&IDX[ANCH]?ANCH:(S.sel&&IDX[S.sel]&&IDX[S.sel].n.kind==="p"?S.sel:null);
    if(a){const vis=[...treeEl.querySelectorAll(".row.p")].map(x=>x.dataset.id),i=vis.indexOf(a),j=vis.indexOf(id);
      if(i>-1&&j>-1){MSEL=new Set(vis.slice(Math.min(i,j),Math.max(i,j)+1));if(MSEL.size>1){S.sel=id;renderTree();renderFiche();return}MSEL.clear()}}}
  MSEL.clear();ANCH=id;select(id);
});
let MSEL=new Set(),ANCH=null;
let dragId=null;
const treeEl=$("#tree");
treeEl.addEventListener("dragstart",e=>{const r=e.target.closest(".row");if(!r)return;dragId=r.dataset.id;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
treeEl.addEventListener("dragend",()=>{dragId=null;clearDrop();document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"))});
function clearDrop(){document.querySelectorAll(".drop-before,.drop-after,.drop-in").forEach(x=>x.classList.remove("drop-before","drop-after","drop-in"))}
function zone(e,r){
  const t=IDX[r.dataset.id].n,b=r.getBoundingClientRect(),y=(e.clientY-b.top)/b.height;
  if(t.kind==="g"){if(y<.28)return"before";if(y>.72&&!(t.children.length&&S.open[t.id]!==false))return"after";return"in"}
  return y<.5?"before":"after";
}
const dragSet=()=>dragId&&MSEL.size>1&&MSEL.has(dragId)?[...MSEL]:null;
function validDrop(tid,z){
  if(!dragId||tid===dragId||isDesc(tid,dragId))return false;
  const ds=dragSet();if(ds&&(ds.includes(tid)||ds.some(id=>isDesc(tid,id))))return false;
  const d=IDX[dragId].n,t=IDX[tid];
  if(z!=="in"&&!t.parent&&d.kind==="p")return false;
  return true;
}
treeEl.addEventListener("dragover",e=>{
  const r=e.target.closest(".row");if(!r||!dragId)return;
  const z=zone(e,r);clearDrop();
  if(!validDrop(r.dataset.id,z)){e.dataTransfer.dropEffect="none";return}
  e.preventDefault();r.classList.add("drop-"+z);
});
treeEl.addEventListener("drop",e=>{
  const r=e.target.closest(".row");if(!r||!dragId)return;
  e.preventDefault();const tid=r.dataset.id,z=zone(e,r);clearDrop();
  if(!validDrop(tid,z))return;
  const ds=dragSet(),nodes=ds?flatP(S.tree).filter(n=>ds.includes(n.id)):[IDX[dragId].n];
  nodes.forEach(n=>{const x=IDX[n.id];x.arr.splice(x.arr.indexOf(n),1)});reindex();
  const t=IDX[tid];
  if(z==="in"){t.n.children.push(...nodes);S.open[t.n.id]=true}
  else t.arr.splice(t.arr.indexOf(t.n)+(z==="after"?1:0),0,...nodes);
  if(ds)toast(nodes.length+" prestations déplacées. Cmd+Z pour annuler.",3000);
  dragId=null;commit();renderFiche();
});
/* Import de lots, sous-lots ou prestations d'un autre projet (.caz) */
$("#b-implots").onclick=()=>pickFile(".caz,.json",file=>{const r=new FileReader();r.onload=()=>openImportLots(r.result,file.name);r.readAsText(file)});
function openImportLots(text,fname){
  let d;try{d=JSON.parse(text)}catch(e){return toast("Ce fichier n'est pas un projet Prescrire lisible.")}
  const p=d&&d.format==="prescrire-projet"?d.projet:d;
  if(!p||!Array.isArray(p.tree)||!p.tree.length)return toast("Ce fichier n'est pas un projet Prescrire, ou il ne contient aucun lot.");
  const src=migrate(JSON.parse(JSON.stringify(p))),lib=normBase(d.bibliotheque||p.db||[]);
  const nr={};(function w(a,pre){a.forEach((n,i)=>{const k=pre?pre+"."+(i+1):String(i+1).padStart(2,"0");nr[n.id]=k;if(n.kind==="g")w(n.children,k)})})(src.tree,"");

/* Fiche de la sélection multiple : actions groupées (une seule étape d'annulation chacune) */
function renderMulti(){
  reindex();
  const el=$("#fiche"),ids=flatP(S.tree).map(n=>n.id).filter(id=>MSEL.has(id)),ns=ids.map(id=>IDX[id].n),tot=ns.reduce((s,n)=>s+lineT(n),0);
  const groups=[];(function w(a,d){a.forEach(n=>{if(n.kind==="g"){groups.push([n,d]);w(n.children,d+1)}})})(S.tree,0);
  el.innerHTML=tabBand(`Sélection · ${ns.length} prestations`)+`<div class="fiche">
    <p class="hint" style="margin:0">Cmd (ou Ctrl) + clic pour ajouter ou retirer une prestation · Maj + clic pour une plage · un clic simple pour revenir à une seule fiche.</p>
    <ul class="msel-list">${ns.map(n=>`<li data-goto1="${n.id}"><span class="n">${esc(IDX[n.id].nr)}</span><span class="nm">${esc(ttl(n)||"Prestation sans nom")}</span>${n.pse?'<span class="pse">PSE</span>':""}<span class="a">${nf.format(lineT(n))}</span></li>`).join("")}</ul>
    <div class="total"><span class="hint">Total HT de la sélection</span><b>${eur(tot)}</b></div>
    <section class="fs"><h4 class="fs-h">Actions groupées</h4>
      <div class="mrow"><span class="lb">État :</span>${ETATS.map(([k,l])=>`<button class="er er-${k}" data-met="${k}"><i class="c-${k}"></i>${k==="redaction"?"En cours":k==="relecture"?"À relire":l}</button>`).join("")}</div>
      <div class="mrow"><label class="lb" for="m-tva">TVA :</label><select id="m-tva"><option value="-">— choisir —</option><option value="">TVA du projet (${fmtT(projTva())})</option>${TAUX.map(t=>`<option value="${t}">${fmtT(t)}</option>`).join("")}</select></div>
      <div class="mrow"><span class="lb">Nature :</span><button class="btn" data-mnat="base">Base</button><button class="btn" data-mnat="pse">PSE</button></div>
      <div class="mrow"><label class="lb" for="m-dest">Déplacer vers :</label><select id="m-dest"><option value="">— choisir un lot ou sous-lot —</option>${groups.map(([g,d])=>`<option value="${g.id}">${"\u00a0\u00a0".repeat(d)}${esc(IDX[g.id].nr+" "+g.nom)}</option>`).join("")}</select><button class="btn" id="m-move">Déplacer</button></div>
    </section>
    <div class="actions" style="border-top:1px solid var(--line);padding-top:14px"><button class="btn" id="m-clear">Tout désélectionner</button><span style="flex:1"></span><button class="btn danger" id="m-del">Supprimer les ${ns.length} prestations</button></div></div>`;
  const done=msg=>{commit();renderFiche();toast(msg+" Cmd+Z pour annuler.",3500)};
  el.querySelectorAll("[data-met]").forEach(b=>b.onclick=()=>withName(()=>{const k=b.dataset.met,now=Date.now();ns.forEach(n=>{if(n.etat!==k){n.etat=k;n.etatPar=myName();n.etatLe=now}});done(`${ns.length} prestations passées à l'état « ${b.textContent.trim()} ».`)}));
  $("#m-tva").onchange=e=>{const v=e.target.value;if(v==="-")return;ns.forEach(n=>n.tva=v===""?null:num(v));done(`TVA appliquée à ${ns.length} prestations.`)};
  el.querySelectorAll("[data-mnat]").forEach(b=>b.onclick=()=>{const pse=b.dataset.mnat==="pse";ns.forEach(n=>{n.pse=pse;delete n.vid});done(`${ns.length} prestations passées en ${pse?"PSE":"base"}.`)});
  $("#m-move").onclick=()=>{const gid=$("#m-dest").value;if(!gid)return $("#m-dest").focus();const g=IDX[gid].n;
    if(ns.some(n=>isDesc(gid,n.id)))return;
    ns.forEach(n=>{const x=IDX[n.id];x.arr.splice(x.arr.indexOf(n),1)});g.children.push(...ns);S.open[gid]=true;
    ancestors(gid).forEach(a=>S.open[a.id]=true);done(`${ns.length} prestations déplacées vers ${IDX[gid]?IDX[gid].nr:""} ${g.nom}.`)};
  $("#m-clear").onclick=()=>{MSEL.clear();renderTree();renderFiche()};
  let armed=false;$("#m-del").onclick=e=>{if(!armed){armed=true;e.target.classList.add("armed");e.target.textContent="Confirmer la suppression";return}
    const first=IDX[ids[0]];ns.forEach(n=>{const x=IDX[n.id];x.arr.splice(x.arr.indexOf(n),1)});MSEL.clear();
    reindex();S.sel=first&&first.parent&&IDX[first.parent.id]?first.parent.id:(S.tree[0]&&S.tree[0].id)||null;done(`${ns.length} prestations supprimées.`)};
  el.querySelectorAll("[data-goto1]").forEach(li=>li.onclick=()=>{MSEL.clear();select(li.dataset.goto1)});
}
function bindDel(n,cnt){
  const b=$("#f-del");
  b.onclick=()=>{
    if(!armedDel){armedDel=true;b.classList.add("armed");b.textContent=n.kind==="g"&&cnt?`Confirmer : supprimer avec ${cnt} prestation${cnt>1?"s":""}`:"Confirmer la suppression";return}
    const x=IDX[n.id];x.arr.splice(x.i,1);
    S.sel=x.arr[x.i]?x.arr[x.i].id:x.arr[x.i-1]?x.arr[x.i-1].id:x.parent?x.parent.id:(S.tree[0]&&S.tree[0].id)||null;
    commit();renderFiche();toast("Supprimé.");
  };
}

let acItems=[],acI=-1;
function acShow(){
  const i=$("#f-nom"),L=$("#ac-list");if(!i)return;
  const q=norm(i.value);if(!q){acHide();return}
  const words=q.split(/\s+/),n=IDX[S.sel]&&IDX[S.sel].n,lot=n?norm(lotNameOf(n)):"";
  const same=a=>lot&&a.lot&&(norm(a.lot)===lot||lot.includes(norm(a.lot))||norm(a.lot).includes(lot));
  acItems=BASE.filter(d=>{const t=norm(d.nom);return words.every(w=>t.includes(w))})
    .sort((a,b)=>(same(b)-same(a))||(norm(a.nom).startsWith(words[0])?-1:0)-(norm(b.nom).startsWith(words[0])?-1:0)||a.nom.localeCompare(b.nom,"fr")).slice(0,10);
  if(!acItems.length||(acItems.length===1&&norm(acItems[0].nom)===q)){acHide();return}
  acI=-1;
  L.innerHTML=acItems.map((d,k)=>`<div class="ac-item" data-k="${k}" role="option"><span class="n">${hl(d.nom,words)}</span><span class="m">${esc(d.u)} · ${nf.format(d.prix)} €</span>${d.lot?`<span class="l">${esc(d.lot)}</span>`:""}</div>`).join("");
  L.hidden=false;i.setAttribute("aria-expanded","true");
  L.onmousedown=e=>{const it=e.target.closest(".ac-item");if(it){e.preventDefault();acPick(+it.dataset.k)}};
}
function hl(s,words){let out="";const t=norm(s),m=new Array(s.length).fill(false);
  words.forEach(w=>{if(!w)return;let p=t.indexOf(w);while(p>-1){for(let k=p;k<p+w.length;k++)m[k]=true;p=t.indexOf(w,p+1)}});
  for(let k=0;k<s.length;k++){const c=esc(s[k]);out+=m[k]&&(k===0||!m[k-1])?"<mark>"+c:c;if(m[k]&&(k===s.length-1||!m[k+1]))out+="</mark>"}return out}
function acHide(){const L=$("#ac-list");if(L)L.hidden=true;const i=$("#f-nom");if(i)i.setAttribute("aria-expanded","false");acI=-1}
function acKey(e){
  const L=$("#ac-list");if(!L||L.hidden)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();acI=(acI+(e.key==="ArrowDown"?1:-1)+acItems.length)%acItems.length;
    L.querySelectorAll(".ac-item").forEach((el,k)=>el.classList.toggle("on",k===acI))}
  else if(e.key==="Enter"&&acI>-1){e.preventDefault();acPick(acI)}
  else if(e.key==="Escape")acHide();
}

const SH={prix:true};
function ficheArticle(n,withPrix){
  const a={id:uid(),nom:(n.nom||"").trim()||ttl(n),lot:lotNameOf(n),cat:n.cat,u:n.u,desc:n.desc||"",cl:clOf(n)};
  if(withPrix)a.prix=num(n.prix);
  return a;
}
function ficheText(n,withPrix){
  const L=[ttl(n)||"Prestation"];
  if((n.desc||"").trim())L.push("",n.desc.trim());
  const c=clOf(n);let i=0;
  CLAUSES.forEach(([g,fs])=>{const f=fs.filter(([k])=>c[k]);if(!f.length)return;L.push("",g);
    f.forEach(([k,l])=>L.push(`${LET(i++)}) ${fs.length>1?l+" : ":""}${String(c[k]).trim()}`))});
  const m=[];if(n.finOn&&(n.fin||"").trim())m.push("Finition : "+n.fin.trim());m.push("Unité de compte : "+(n.u||""));
  if(withPrix&&num(n.prix))m.push("Prix unitaire HT : "+eur(num(n.prix)));
  L.push("",...m);
  return L.join("\n");
}

/* Import de fiches, d'un recueil ou d'une sauvegarde de bibliothèque : fusion par nom */
function importLibText(text){
  let d;try{d=JSON.parse(text)}catch(e){return toast("Ce fichier n'est ni une fiche, ni un recueil, ni une sauvegarde de bibliothèque.")}
  if(d&&d.format==="prescrire-projet")return toast("C'est un projet : ouvrez-le avec « Ouvrir… ».");
  const raw=Array.isArray(d)?d:(d.articles||d.bibliotheque||[]);
  if(!Array.isArray(raw)||!raw.length)return toast("Aucune fiche trouvée dans ce fichier.");
  const arr=normBase(raw);let a=0,u=0;
  arr.forEach((x,k)=>{const hasP=raw[k]&&raw[k].prix!=null,z=BASE.find(b=>norm(b.nom)===norm(x.nom));
    if(z){Object.assign(z,{lot:x.lot||z.lot,cat:x.cat||z.cat,u:x.u||z.u,desc:x.desc||z.desc,cl:Object.keys(clOf(x)).length?clOf(x):z.cl});if(hasP)z.prix=x.prix;u++}
    else{BASE.push(x);a++}});
  saveBase();if(!$("#modal").hidden&&$("#lb-list"))try{libList();libEdit()}catch(e){}
  toast(`Bibliothèque : ${a} fiche${a>1?"s":""} ajoutée${a>1?"s":""}, ${u} mise${u>1?"s":""} à jour.`,4500);
}
/* Glisser un fichier sur la fenêtre : fiche ou recueil (.json) → bibliothèque ; projet (.caz) → ouverture */
window.addEventListener("dragover",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault()});
window.addEventListener("drop",e=>{
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();
  if(/\.caz$/i.test(f.name))return guardDirty("Ouvrir",()=>openProjectFile(f,null));
  if(!/\.json$/i.test(f.name))return toast("Glissez une fiche ou un recueil (.json), ou un projet (.caz).");
  const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(err){}
    if(d&&d.format==="prescrire-projet")return guardDirty("Ouvrir",()=>openProjectText(r.result,f.name,null));importLibText(r.result)};r.readAsText(f);
});

function byLieu(){
  const m=new Map();S.lieux.forEach(l=>m.set(l.nom,[]));const none=[];
  walkP(S.tree,n=>{if(!n.lieux.length)none.push(n);else n.lieux.forEach(l=>{if(!m.has(l))m.set(l,[]);m.get(l).push(n)})});
  const out=[...m].filter(([,v])=>v.length);
  if(none.length)out.push(["Non localisé",none]);
  return out;
}

function dpgfTSV(){

  const rec=(arr,pse)=>arr.forEach(n=>{const nr=IDX[n.id].nr;
    if(n.kind==="g"){if(hasMode(n,pse)){L.push(`${nr}\t${n.nom}\t\t\t\t`);rec(n.children,pse)}}
    else if(!!n.pse===pse&&!n.vid)L.push(`${nr}\t${ttl(n).replace(/\t/g," ")}\t${n.u}\t${n.qte===""?"":String(num(n.qte)).replace(".",",")}\t${tsvN(n.prix)}\t${tsvN(lineT(n))}`)});
  S.tree.forEach(l=>{const nr=IDX[l.id].nr;L.push(`${nr}\tLOT ${nr} — ${l.nom.toUpperCase()}\t\t\t\t`);rec(l.children,false);L.push(`\tSous-total lot ${nr}\t\t\t\t${tsvN(baseT(l))}`);
    if(hasMode(l,true)){L.push(`\tPrestations supplémentaires éventuelles\t\t\t\t`);rec(l.children,true);L.push(`\tSous-total PSE lot ${nr}\t\t\t\t${tsvN(pseT(l))}`)}L.push("")});
  const ht=S.tree.reduce((s,l)=>s+baseT(l),0),br=tvaBreak(S.tree,false);

const dlP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);

async function blobB64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

let LASTDIR=null;
async function saveFile(filename,blob){

  }

function showDiff(id){
  const snap=S.indices.find(x=>x.id===id);if(!snap)return;
  reindex();
  const mapOld=new Map(),nrOld=new Map();
  (function w(arr,prefix){arr.forEach((n,i)=>{const nr=prefix?prefix+"."+(i+1):String(i+1).padStart(2,"0");if(n.kind==="g")w(n.children,nr);else{mapOld.set(n.id,n);nrOld.set(n.id,nr)}})})(snap.tree,"");
  const cur=flatP(S.tree),add=[],mod=[],del=[];
  const f=(v)=>qf.format(num(v));
  cur.forEach(n=>{const o=mapOld.get(n.id);if(!o){add.push(n);return}
    const ch=[];
    if(ttl(o)!==ttl(n))ch.push(`Intitulé : ${ttl(o)} → ${ttl(n)}`);
    if(r2(num(o.qte))!==r2(num(n.qte)))ch.push(`Quantité : ${f(o.qte)} → ${f(n.qte)} ${n.u}`);
    if(o.u!==n.u)ch.push(`Unité : ${o.u} → ${n.u}`);
    if(r2(num(o.prix))!==r2(num(n.prix)))ch.push(`Prix unitaire : ${nf.format(num(o.prix))} → ${nf.format(num(n.prix))} €`);
    if((o.desc||"")!==(n.desc||""))ch.push("Descriptif modifié");if(clSig(o)!==clSig(n))ch.push("Descriptif détaillé modifié");
    if((o.lieux||[]).join("|")!==n.lieux.join("|"))ch.push(`Localisation : ${(o.lieux||[]).join(", ")||"aucune"} → ${n.lieux.join(", ")||"aucune"}`);
    if(!!o.pse!==!!n.pse)ch.push(n.pse?"Passée en PSE":"Sortie des PSE");
    if((o.vid||"")!==(n.vid||""))ch.push(n.vid?"Passée en variante":"Revenue dans la solution de base");
    if((o.tva??null)!==(n.tva??null))ch.push(`TVA : ${o.tva!=null?fmtT(o.tva):"du projet"} → ${n.tva!=null?fmtT(n.tva):"du projet"}`);
    if((o.fin||"")!==(n.fin||"")||!!o.finOn!==!!n.finOn)ch.push("Finition modifiée");
    if(nrOld.get(n.id)!==IDX[n.id].nr)ch.push(`Numéro : ${nrOld.get(n.id)} → ${IDX[n.id].nr}`);
    if(ch.length)mod.push([n,ch]);mapOld.delete(n.id)});
  mapOld.forEach((o,id)=>del.push([o,nrOld.get(id)]));
  const ht=S.tree.reduce((s,l)=>s+baseT(l),0);
  const body=`<p>Montant HT : ${eur(snap.ht)} à l'indice ${esc(snap.indice)} → ${eur(ht)} aujourd'hui (${pf.format(snap.ht?(ht-snap.ht)/snap.ht*100:0)} %).</p>
   <div class="difflist">
   <h4>Prestations ajoutées (${add.length})</h4>${add.map(n=>`<div class="d"><span>${IDX[n.id].nr}</span><span>${esc(ttl(n))}<small>${qf.format(num(n.qte))} ${esc(n.u)} · ${eur(lineT(n))}</small></span></div>`).join("")||'<p class="hint">Aucune</p>'}
   <h4>Prestations supprimées (${del.length})</h4>${del.map(([o,nr])=>`<div class="d"><span>${nr}</span><span>${esc(ttl(o))}</span></div>`).join("")||'<p class="hint">Aucune</p>'}
   <h4>Prestations modifiées (${mod.length})</h4>${mod.map(([n,ch])=>`<div class="d"><span>${IDX[n.id].nr}</span><span>${esc(ttl(n))}${ch.map(c=>`<small>${esc(c)}</small>`).join("")}</span></div>`).join("")||'<p class="hint">Aucune</p>'}
   </div>`;
  openModal(`Changements depuis l'indice ${snap.indice}`,body,`<button class="btn" id="df-back">Retour au projet</button><button class="btn primary" data-m="close">Fermer</button>`,{sub:"figé le "+snap.date});
  $("#df-back").onclick=()=>{closeModal();openProjet()};
}

const DBL={mode:"strict",cur:null,skip:new Set(),inv:false,last:null,backup:false};
const DBL_STOP=new Set("de du des la le les l d en et a au aux sur pour avec par un une y compris type".split(" "));
const DBL_SYN={ba13:"plaque platre",ba18:"plaque platre",pc:"prise courant",pse:"polystyrene",ps:"polystyrene",pvc:"pvc",ep:"epaisseur",fp:"fourniture pose",ml:"m"};
function dblKey(t){return norm(t).replace(/[^a-z0-9,./+]+/g," ").split(" ").filter(w=>w&&!DBL_STOP.has(w)).map(w=>DBL_SYN[w]||w).join(" ")}
function bigr(t){const r=new Set();const x=" "+t+" ";for(let i=0;i<x.length-1;i++)r.add(x.slice(i,i+2));return r}
function dice(A,B){if(!A.size||!B.size)return 0;let c=0;A.forEach(x=>{if(B.has(x))c++});return 2*c/(A.size+B.size)}
function jacc(a,b){const A=new Set(a.split(" ").filter(Boolean)),B=new Set(b.split(" ").filter(Boolean));if(!A.size||!B.size)return 0;let c=0;A.forEach(x=>{if(B.has(x))c++});return c/(A.size+B.size-c)}
function nodupSet(){try{return new Set(T?(CFG.nodup||[]):JSON.parse(localStorage.getItem("prescrire-nondoublons")||"[]"))}catch(e){return new Set()}}
async function nodupAdd(k){const s=nodupSet();s.add(k);const a=[...s];
  if(T){CFG.nodup=a;try{await inv("write_text",{path:CFG_PATH,content:JSON.stringify(CFG,null,1)})}catch(e){}}else{try{localStorage.setItem("prescrire-nondoublons",JSON.stringify(a))}catch(e){}}}
const pairKey=(a,b)=>[a.id,b.id].sort().join("|");
function dblPairs(mode){
  const thr=(mode||DBL.mode)==="large"?.6:.76,no=nodupSet();
  const F=BASE.map(a=>{const k=dblKey(a.nom),d=dblKey(a.desc||"");return{a,k,bk:bigr(k),bd:d?bigr(d):null}});
  const out=[];
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){const x=F[i],y=F[j];
    if(no.has(pairKey(x.a,y.a)))continue;
    let s=x.k===y.k?1:Math.max(dice(x.bk,y.bk),.55*dice(x.bk,y.bk)+.45*jacc(x.k,y.k));
    if(s<thr-.12)continue;
    if(x.bd&&y.bd)s=.82*s+.18*dice(x.bd,y.bd);
    const why=[];if(x.a.lot&&x.a.lot===y.a.lot){s+=.04;why.push(x.a.lot)}else if(x.a.lot&&y.a.lot)s-=.03;
    if(x.a.u===y.a.u){s+=.03;why.push("même unité")}else{s-=.06;why.push(`unités différentes (${x.a.u} / ${y.a.u})`)}
    if(x.a.cat===y.a.cat)why.push("même catégorie");
    if(x.k===y.k)why.unshift("même nom");
    s=Math.min(x.k===y.k?1:.99,s);if(s>=thr)out.push({a:x.a,b:y.a,s,why})}
  return out.sort((p,q)=>q.s-p.s).slice(0,300);
}
function dblCount(){const c=$("#lb-ndbl");if(!c)return;const n=dblPairs().filter(p=>!DBL.skip.has(pairKey(p.a,p.b))).length;c.textContent=n||"";c.hidden=!n}
const useCnt=a=>{let c=0;walkP(S.tree,n=>{const z=baseOf(n);if(z===a)c++});return c};
const DBL_F=[["nom","Désignation"],["lot","Lot"],["cat","Catégorie"],["u","Unité"],["prix","Prix HT"],["desc","Descriptif"],["cl","Détaillé"]];
function dblVal(a,k){if(k==="prix")return r2(num(a.prix));if(k==="cl")return clSig(a);return(a[k]||"").trim()}
function dblShow(a,k,other){
  if(k==="prix")return`${esc(eur(num(a.prix)))}${a.prixMaj?` <small class="hint">prix du ${esc(dateFr(a.prixMaj))}</small>`:""}`;
  if(k==="cl"){const c=clCount(a);return c?`${c} clause${c>1?"s":""}`:'<span class="hint">vide</span>'}
  if(k==="desc"){const t=a.desc||"";if(!t.trim())return'<span class="hint">vide</span>';const tk=w=>norm(w).replace(/[^a-z0-9]+/g,""),ow=new Set((other.desc||"").split(/\s+/).map(tk).filter(Boolean));
    return t.split(/(\s+)/).map(w=>{const z=tk(w);return z&&!ow.has(z)?`<mark>${esc(w)}</mark>`:esc(w)}).join("")}
  return a[k]?esc(a[k]):'<span class="hint">vide</span>'}
function dblDefault(A,B,k){

  if(k==="desc")return(B.desc||"").trim().length>(A.desc||"").trim().length?"b":"a";

  const list=`<div class="dbl-side"><div class="dbl-sh"><span class="lab">Paires à examiner</span><span class="seg" role="radiogroup" aria-label="Sensibilité"><button role="radio" data-dm="strict" aria-checked="${DBL.mode==="strict"}">Strict</button><button role="radio" data-dm="large" aria-checked="${DBL.mode==="large"}">Large</button></span></div>
    ${P.length?`<ul class="dbl-list">${P.map(p=>{const k=pairKey(p.a,p.b);return`<li><button data-dp="${k}" class="${k===DBL.cur?"on":""}"><span class="nm">${esc(p.a.nom)}</span><span class="sc">${Math.round(p.s*100)} %</span><span class="nm">${esc(p.b.nom)}</span><span></span><span class="why">${esc(p.why.join(" · "))}</span></button></li>`}).join("")}</ul>`

  box.innerHTML=last+`<div class="dbl-grid">${list}<div class="dbl-main"><div class="dbl-cmp"><table class="dbl-t"><colgroup><col style="width:110px"><col><col></colgroup>
    <thead><tr><th></th>${head(A,"Article conservé",ua)}${head(B,"Fusionné dans le premier",ub)}</tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">Cochez la valeur à garder pour chaque champ différent. Prescrire présélectionne le prix le plus récent et le texte le plus complet ; les mots présents d'un seul côté sont surlignés. <button class="link" id="dk-inv">Garder plutôt le second</button></p></div>

  dblBind(cur,A,B);

const cv=v=>{if(v==null)return"";if(typeof v==="object"){if(v instanceof Date)return v.toLocaleDateString("fr-FR");if("result" in v)return v.result??"";if(v.richText)return v.richText.map(r=>r.text).join("");if(v.text)return v.text;if("formula" in v)return"";}return v};
const str=v=>String(cv(v)??"").trim();
const normU=u=>{const t=norm(u).replace(/\./g,"");return({m2:"m²","m²":"m²",m3:"m³","m³":"m³",ml:"ml",u:"U",un:"U",unite:"U",ens:"ens.",ensemble:"ens.",ft:"for.",for:"for.",forfait:"for.",f:"for.",kg:"kg",h:"h",heure:"h"})[t]||(u?String(u).trim():"")};
async function importLibXlsx(file){
  if(!needLib("ExcelJS"))return;
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  let added=0,upd=0,sheets=0,newCats=0;
  wb.eachSheet(ws=>{
    let hr=0,map={};
    for(let r=1;r<=Math.min(20,ws.rowCount);r++){const m={};ws.getRow(r).eachCell((c,col)=>{const t=norm(str(c.value));if(!t)return;
      if(/^(designation|libelle|intitule|nom|article|prestation|ouvrage)/.test(t))m.nom??=col;
      else if(/^(u|unite|unites)$/.test(t))m.u??=col;
      else if(/^(pu|p\.u|prix)/.test(t))m.prix??=col;
      else if(/^(descriptif|description|texte|prescription|cctp)/.test(t))m.desc??=col;
      else if(/support/.test(t))m.support??=col;
      else if(/entrepreneur/.test(t))m.entrepreneur??=col;
      else if(/realisation/.test(t))m.realisation??=col;
      else if(/interruption/.test(t))m.interruption??=col;
      else if(/finalisation/.test(t))m.finalisation??=col;
      else if(/^limite/.test(t))m.limites??=col;
      else if(/^lot/.test(t))m.lot??=col;
      else if(/^categ/.test(t))m.cat??=col});
      if(m.nom){hr=r;map=m;break}}
    if(!hr)return;sheets++;
    const sheetLot=/^r[ée]cap/i.test(ws.name)?"":ws.name.replace(/^lot\s*[\d.]+\s*[-–—]?\s*/i,"").trim();
    for(let r=hr+1;r<=ws.rowCount;r++){
      const row=ws.getRow(r),nom=str(row.getCell(map.nom).value);
      if(!nom||/^(sous-total|total|lot\s|prestations suppl|tva)/i.test(nom))continue;
      const u=map.u?normU(str(row.getCell(map.u).value)):"",prix=map.prix?num(cv(row.getCell(map.prix).value)):0,desc=map.desc?str(row.getCell(map.desc).value):"";
      if(!u&&!prix&&!desc)continue;
      const lot=map.lot?str(row.getCell(map.lot).value):sheetLot,cat=map.cat?str(row.getCell(map.cat).value):"";
      const cl={};CL_KEYS.forEach(k=>{if(map[k]){const v=str(row.getCell(map[k]).value);if(v)cl[k]=v}});
      if(cat&&!catList().some(c=>norm(c)===norm(cat))){CATS=[...catList(),cat];CATS_MAJ=Date.now();newCats++}
      const catOk=cat?catList().find(c=>norm(c)===norm(cat)):"";
      const z=BASE.find(b=>norm(b.nom)===norm(nom));
      if(z){if(u)z.u=u;if(prix)z.prix=prix;if(desc)z.desc=desc;if(lot)z.lot=lot;if(catOk)z.cat=catOk;if(Object.keys(cl).length)z.cl=Object.assign({},z.cl,cl);upd++}
      else{BASE.push({id:uid(),nom,lot,cat:catOk||catList()[0],u:u||"U",prix,desc,cl});added++}
    }
  });
  saveBase();libList();libEdit();
  if(!sheets)return toast("Aucune colonne « Désignation » trouvée dans ce fichier.",4000);
  toast(`Import terminé : ${added} article(s) ajouté(s), ${upd} mis à jour${newCats?`, ${newCats} catégorie(s) créée(s)`:""}.`,4000);
}
async function exportLibXlsx(){
  if(!needLib("ExcelJS"))return;
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Bibliothèque",{views:[{state:"frozen",ySplit:1}]});
  ws.columns=[{header:"Lot",width:26},{header:"Désignation",width:48},{header:"Catégorie",width:22},{header:"U",width:7},{header:"Prix HT",width:12},{header:"Descriptif",width:80},...CLAUSES.flatMap(([g,fs])=>fs.map(([k,l])=>({header:fs.length>1?g+" — "+l:l,width:50})))];
  ws.getRow(1).font={bold:true,name:"Arial",size:10};
  BASE.slice().sort((a,b)=>(a.lot||"~").localeCompare(b.lot||"~","fr")||a.nom.localeCompare(b.nom,"fr")).forEach(a=>{const r=ws.addRow([a.lot,a.nom,a.cat,a.u,a.prix,a.desc,...CL_KEYS.map(k=>(a.cl||{})[k]||"")]);r.font={name:"Arial",size:10};r.getCell(5).numFmt='#,##0.00 "€"';r.getCell(6).alignment={wrapText:true,vertical:"top"};r.getCell(2).alignment={wrapText:true,vertical:"top"}});
  ws.autoFilter={from:"A1",to:{row:1,column:6+CL_KEYS.length}};
  await saveFile(`Bibliothèque Prescrire ${today().replace(/\//g,"-")}.xlsx`,new Blob([await wb.xlsx.writeBuffer()],{type:XLSX_MIME}));
}

  const clauses=(n,flat)=>{const c=clOf(n),out=[];let i=0;

  const art=n=>{const nr=IDX[n.id].nr,o=[head(nr,ttl(n)||"Prestation sans nom",3,{pse:n.pse})];

/* Tableau des choix pour la MOA : finitions, sans aucun prix */
function choixData(lotIds){
  const lots=S.tree.filter(l=>lotIds.includes(l.id)&&hasFin(l)),rows=[];
  const rec=(arr,d)=>arr.forEach(n=>{if(!hasFin(n))return;
    if(n.kind==="g"){rows.push({g:d,nr:IDX[n.id].nr,nom:n.nom});rec(n.children,d+1)}

/* Enregistre un ou plusieurs fichiers : un dossier à choisir dans l'appli, des téléchargements successifs dans le navigateur */
async function saveMany(files){
  files=files.filter(Boolean);if(!files.length)return;
  if(files.length===1)return saveFile(files[0].name,files[0].blob);
  if(T){
    const dir=await T.dialog.open({directory:true,defaultPath:LASTDIR||(DIRS&&DIRS.documents)||undefined,title:`Dossier où enregistrer les ${files.length} fichiers`});
    if(!dir)return false;
    let ok=0;for(const f of files){try{await inv("write_b64",{path:pjoin(dir,f.name),data:await blobB64(f.blob)});ok++}catch(e){toast("Échec : "+f.name+" ("+e+")",6000)}}
    LASTDIR=dir;toast(`${ok} fichier${ok>1?"s":""} enregistré${ok>1?"s":""} dans ${pbase(dir)}.`,4500);return true;
  }
  for(const f of files){if(await saveFile(f.name,f.blob)===false&&(await dlP))break;await new Promise(r=>setTimeout(r,400))}
  return true;
}
/* Lance l'export choisi dans la fenêtre : un fichier, ou un fichier par lot */
async function runExport(doc,type,ids,recap,split){
  toast("Préparation de l'export…",60000);
  const one=list=>doc==="choix"?(type==="pdf"?exportChoixPdf(list):exportChoixXlsx(list)):doc==="dpgf"?exportXlsx(type,list,false):doc==="pdf"?exportPdf(list):exportDocx(list);
  if(doc==="choix")ids=ids.filter(id=>hasFin(IDX[id].n));
  let files=[];
  if(split){
    for(const id of ids)files.push(await one([id]));
    if(doc==="dpgf"&&recap)files.push(await exportXlsx(type,[],true,ids));
  }else files.push(doc==="dpgf"?await exportXlsx(type,ids,recap):await one(ids));
  if(!files.filter(Boolean).length){$("#toast").hidden=true;return toast(doc==="choix"?"Aucune finition renseignée dans les lots choisis.":"Rien à exporter.",4000)}
  $("#toast").hidden=true;
  return saveMany(files);
}

function bindVars(l){
