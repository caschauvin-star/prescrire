<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prescrire</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout : application plein écran en trois colonnes (arborescence | fiche | sortie CCTP/DPGF/offres), empilées sur écran étroit */
:root{
  --bg:#e9ecef; --panel:#fbfbfc; --ink:#1b2430; --muted:#5b6674; --line:#d3d9e0; --line-soft:#e6eaee;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e2eaf5; --danger:#a3361c; --danger-soft:#f7e6e1; --paper:#ffffff;
  --ok:#2c6e3f; --ok-soft:#e0efe4; --warn:#8a5a00; --warn-soft:#fbefd5;
  --f-body:"IBM Plex Sans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-label:"IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --panel:#181d23; --ink:#e4e8ed; --muted:#94a0ad; --line:#2b333c; --line-soft:#222930;
  --accent:#7fa9e3; --accent-ink:#0d1622; --accent-soft:#1d2a3b; --danger:#e58a72; --danger-soft:#3a221c; --paper:#1d232a;
  --ok:#7cc493; --ok-soft:#1a2e21; --warn:#e2b55a; --warn-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --panel:#181d23; --ink:#e4e8ed; --muted:#94a0ad; --line:#2b333c; --line-soft:#222930;
  --accent:#7fa9e3; --accent-ink:#0d1622; --accent-soft:#1d2a3b; --danger:#e58a72; --danger-soft:#3a221c; --paper:#1d232a;
  --ok:#7cc493; --ok-soft:#1a2e21; --warn:#e2b55a; --warn-soft:#352a12; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-label);font-weight:600;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-radius:2px;position:relative}
.brand i::after{content:"";position:absolute;inset:3px 3px auto auto;width:4px;height:4px;background:var(--accent)}
.proj{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
#p-nom{background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;min-width:0;font-weight:600;font-size:15px;flex:1 1 240px}
#p-nom:hover,#p-nom:focus{border-color:var(--line);background:var(--panel)}
.p-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.p-meta .dirty{color:var(--warn)}
.p-meta .tagphase{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.top-actions .sep{width:1px;background:var(--line);margin:0 4px}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,23%) minmax(340px,1fr) minmax(400px,1.25fr);gap:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.col-h h2{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600;flex:1}
.col-b{flex:1;overflow:auto;min-height:0}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line);color:inherit}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:0 6px;font-size:11px;cursor:pointer;color:var(--muted);font-family:var(--f-mono);line-height:18px}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}

/* Arborescence */
.tree-tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
ul.tree{list-style:none;margin:0;padding:6px 0}
ul.tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;padding:4px 10px 4px calc(10px + var(--d,0) * 16px);cursor:pointer;border-top:2px solid transparent;border-bottom:2px solid transparent;user-select:none}
.row:hover{background:var(--line-soft)}
.row.sel{background:var(--accent-soft)}
.row.sel .nm{color:var(--accent)}
.row .car{width:14px;flex:none;color:var(--muted);font-size:10px;text-align:center;border:0;background:none;padding:0;cursor:pointer}
.row .num{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.g .nm{font-family:var(--f-label);font-weight:600;letter-spacing:.01em}
.row.g0 .nm{text-transform:uppercase;font-size:12.5px;letter-spacing:.04em}
.row .amt{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row.p .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none;margin:0 4px}
.pse{font-family:var(--f-label);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:0 4px;flex:none}
.row.drop-before{border-top-color:var(--accent)}
.row.drop-after{border-bottom-color:var(--accent)}
.row.drop-in{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.row.dragging{opacity:.4}
.tree-hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}

/* Fiche */
.fiche{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.fiche-title{display:flex;align-items:baseline;gap:10px}
.fiche-title .num{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.fiche-title h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 12px;background:var(--bg);border-radius:4px;font-size:13px;margin:0}
.ro dt{font-family:var(--f-label);color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.ro dd{margin:0;min-width:0;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab,.f>label{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.f input[type=text],.f input[type=number],.f select,.f textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--paper);width:100%;min-width:0}
.f textarea{resize:vertical;min-height:84px;line-height:1.45}
.f input.numin{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.f input.locked{background:var(--bg);color:var(--muted);cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--danger)}
.qres{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:18px;font-size:12px;color:var(--muted)}
.qres b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.libhint{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.libhint .dotc{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.libhint.mod .dotc{background:var(--warn)}
.libhint.new .dotc{background:var(--accent)}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% - 18px);margin-top:2px;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:20;max-height:300px;overflow:auto}
.ac-item{padding:6px 9px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.ac-item.on,.ac-item:hover{background:var(--accent-soft)}
.ac-item .n{min-width:0}
.ac-item .m{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ac-item .l{grid-column:1/-1;font-family:var(--f-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ac-item mark{background:none;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .niv{font-family:var(--f-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%;margin-top:4px}
.chips .niv:first-child{margin-top:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--paper);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .hint{color:inherit;opacity:.8}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.fin{display:flex;gap:10px;align-items:center}
.fin input[type=text]{flex:1}
.fin input:disabled{opacity:.5}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.total b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px 24px;color:var(--muted);text-align:center;max-width:60ch;margin:0 auto}
.ql{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.ql-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ql-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px auto;align-items:center;gap:6px}
.ql-row .ln{min-width:0;overflow-wrap:anywhere}
.ql-row .ln small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql-row input{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--panel);font-family:var(--f-mono);text-align:right;width:100%;min-width:0}
.ql-row input.bad{border-color:var(--danger)}
.ql-row .u{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ql-row .qm{display:flex;gap:4px}
.ql-sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.ql-sum b{font-family:var(--f-mono);text-align:right}

/* Sortie */
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:4px 10px;font-family:var(--f-label);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.seg-lab{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:5px 10px;background:var(--bg);border-right:1px solid var(--line)}
.seg button{border:0;background:var(--panel);padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.out-tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;align-items:center}
.cctp{padding:22px 26px 40px;background:var(--paper);max-width:72ch;margin:0 auto}
.cctp h1{font-size:18px;margin:0 0 2px;text-wrap:balance}
.cctp .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.cctp h2{font-family:var(--f-label);font-size:14px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin:26px 0 10px}
.cctp h3{font-size:14px;margin:18px 0 6px;font-weight:600}
.cctp .art{margin:10px 0 14px;cursor:pointer;border-radius:3px}
.cctp .art:hover{background:var(--line-soft)}
.cctp .art.sel{background:var(--accent-soft)}
.cctp h4{font-size:13.5px;margin:0 0 3px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cctp h4 span.nr,.cctp h3 span{font-family:var(--f-mono);font-weight:500;margin-right:8px;color:var(--muted)}
.cctp h4 span.nr{margin-right:0}
.cctp p{margin:0 0 4px;white-space:pre-line}
.cctp .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.cctp .meta b{color:var(--ink);font-weight:500}
.cctp .intro{font-style:italic;color:var(--muted)}
.cctp .lotref{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 3px}
.lotbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.tblwrap{overflow-x:auto;padding:0 0 30px}
table.dpgf{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.dpgf th{position:sticky;top:0;background:var(--panel);font-family:var(--f-label);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--ink);z-index:1}
.dpgf td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.dpgf .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dpgf .c{text-align:center}
.dpgf .n{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.dpgf tr.lot td{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--bg);padding-top:8px}
.dpgf tr.psehead td{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--warn-soft);color:var(--warn);padding-top:8px}
.dpgf tr.grp td{font-weight:600}
.dpgf tr.art{cursor:pointer}
.dpgf tr.art:hover td{background:var(--line-soft)}
.dpgf tr.art.sel td{background:var(--accent-soft)}
.dpgf tr.st td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
.dpgf tr.tot td{font-weight:600;font-size:13.5px}
.dpgf tr.ttc td{font-weight:600;font-size:14px;border-top:1.5px solid var(--ink)}
.dpgf .zero{color:var(--danger)}
.dpgf .tag{font-family:var(--f-label);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dpgf select{border:1px solid var(--line);border-radius:3px;background:var(--paper);padding:1px 4px;font-family:var(--f-mono);font-size:12px}
.dpgf td.best{background:var(--ok-soft)}
.dpgf .ec{display:block;font-size:11px}
.ec.lo{color:var(--danger)} .ec.hi{color:var(--warn)} .ec.eq{color:var(--muted)}
.dpgf td.miss{background:var(--danger-soft);color:var(--danger);text-align:center;font-family:var(--f-label);font-size:11px}
.dpgf td.flag-lo{box-shadow:inset 3px 0 0 var(--danger)}
.dpgf td.flag-hi{box-shadow:inset 3px 0 0 var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.offchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--paper)}
.offchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0 6px}
.offchip button:hover{color:var(--accent)}

/* Fenêtres */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,24,.45)}
.dlg{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.3);width:min(580px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column}
.dlg.wide{width:min(1060px,100%);height:min(760px,calc(100% - 32px))}
.dlg-h{padding:16px 20px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:12px}
.dlg-h h3{margin:0;font-size:16px;flex:1}
.dlg-b{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.dlg fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.dlg legend{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;background:var(--paper)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.optrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lotlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--paper);max-height:240px;overflow:auto}
.lotlist label{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lotlist label:last-child{border-bottom:0}
.lotlist .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lotlist .a{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.recap-opt{border-top:1.5px solid var(--line)}
.x-sum{font-size:12.5px;color:var(--muted);margin-right:auto}
.libloc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.libloc .dotc{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.libloc .dotc.bad{background:var(--danger)}
.lib{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px;min-height:0;flex:1}
.lib-list{border:1px solid var(--line);border-radius:4px;overflow:auto;background:var(--paper);min-height:0}
.lib-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib-tools input,.lib-tools select{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--paper)}
.lib-tools input{flex:1 1 200px;min-width:0}
table.lt{border-collapse:collapse;width:100%;font-size:12.5px}
.lt th{position:sticky;top:0;background:var(--panel);text-align:left;font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);z-index:1}
.lt td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.lt tr.it{cursor:pointer}
.lt tr.it:hover td{background:var(--line-soft)}
.lt tr.it.on td{background:var(--accent-soft)}
.lt .r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.lt .lotc{font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lib-edit{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
table.lieux{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.lieux th{text-align:left;font-family:var(--f-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.lieux td{padding:4px 6px;border-bottom:1px solid var(--line-soft)}
.lieux input{border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--paper);width:100%;min-width:0}
.lieux input.numin{font-family:var(--f-mono);text-align:right}
.lieux td.calc{font-family:var(--f-mono);text-align:right;color:var(--muted);white-space:nowrap}
.lieux td.act{white-space:nowrap}
.difflist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.difflist h4{margin:10px 0 4px;font-family:var(--f-label);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.difflist .d{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.difflist .d span:first-child{font-family:var(--f-mono);color:var(--muted)}
.difflist .d small{display:block;color:var(--muted)}
.idx-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.idx-list .ir{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.idx-list .ir:last-child{border-bottom:0}
.idx-list .ir b{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width: 1100px){
  html,body{height:auto}
  .app{height:auto}
  .cols{grid-template-columns:1fr}

<body>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Prescrire</div>
    <div class="proj">
      <input id="p-nom" type="text" aria-label="Nom de l'opération" placeholder="Nom de l'opération">
      <span class="p-meta" id="p-meta"></span>
    </div>
    <div class="top-actions">
      <button class="btn" id="b-new">Nouveau…</button>
      <button class="btn" id="b-open">Ouvrir…</button>
      <button class="btn" id="b-save">Enregistrer</button>
      <button class="btn" id="b-saveas" hidden>Enregistrer sous…</button>
      <span class="sep"></span>
      <button class="btn" id="b-proj">Projet</button>
      <button class="btn" id="b-lieux">Lieux</button>
      <button class="btn" id="b-lib">Bibliothèque</button>
    </div>
  </header>

  <div class="cols">
    <section class="col" aria-label="Lots et prestations">
      <div class="col-h"><h2>Lots et prestations</h2></div>
      <div class="tree-tools">
        <button class="btn" id="b-lot">+ Lot</button>
        <button class="btn" id="b-slot">+ Sous-lot</button>
        <button class="btn primary" id="b-presta">+ Prestation</button>
      </div>
      <div class="col-b">
        <ul class="tree" id="tree"></ul>
        <p class="tree-hint">Glissez une ligne pour la déplacer : au-dessus ou en dessous d'une ligne pour la placer avant ou après, au milieu d'un lot pour l'y ranger.</p>
      </div>
    </section>

    <section class="col" aria-label="Fiche">
      <div class="col-h"><h2 id="fiche-h">Fiche prestation</h2></div>
      <div class="col-b" id="fiche"></div>
    </section>

    <section class="col" aria-label="Documents">
      <div class="col-h">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="t-cctp">CCTP</button>
          <button class="tab" role="tab" id="t-dpgf">DPGF</button>
          <button class="tab" role="tab" id="t-off">Offres</button>
        </div>
        <div class="seg" role="group" aria-label="Affichage" id="seg">
          <span class="seg-lab">Afficher</span>
          <button id="v-lots">Par lots</button>
          <button id="v-lieux">Par lieux</button>
        </div>
      </div>
      <div class="out-tools" id="out-tools">
        <button class="btn" id="b-copy">Copier</button>
        <span style="flex:1"></span>
        <button class="btn primary" id="b-export">Exporter…</button>
      </div>
      <div class="col-b" id="out"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="dlg-h"><h3 id="m-title"></h3><span class="hint" id="m-sub"></span></div>
    <div class="dlg-b" id="m-body"></div>
    <div class="dlg-f" id="m-foot"></div>
  </div>
</div>
<input type="file" id="file" hidden>

      if(Number.isInteger(q)){const b=Math.floor(q/k);n.lieux.forEach((l,i)=>n.ql[l]=b+(i<q-b*k?1:0))}
      else{const p=Math.floor(q/k*100)/100;n.lieux.forEach((l,i)=>n.ql[l]=i<k-1?p:r2(q-p*(k-1)))}}
  });
  return s;
}

/* ======================================================================
   Bibliothèque partagée : chaque article porte sa date de modification ;
   à l'enregistrement, on relit le fichier et on fusionne article par article
   (le plus récent l'emporte), pour que plusieurs postes puissent écrire.
   ====================================================================== */
const T=window.__TAURI__||null,inv=(c,a)=>T.core.invoke(c,a);
let SNAP=new Map(),TOMB=[],ME="",LIB_PATH=null,LIB_MTIME=0,LIB_ERR="",CFG={},CFG_PATH=null,DIRS=null;
const artKey=a=>JSON.stringify([a.nom,a.lot,a.cat,a.u,r2(num(a.prix)),a.desc]);
function resnap(){SNAP=new Map(BASE.map(a=>[a.id,artKey(a)]))}
function stamp(){const now=Date.now(),seen=new Set();
  BASE.forEach(a=>{seen.add(a.id);if(SNAP.get(a.id)!==artKey(a)){a.maj=now;a.par=ME||a.par||""}});
  SNAP.forEach((k,id)=>{if(!seen.has(id))TOMB.push({id,maj:now})});resnap()}
function mergeLib(disk){
  const tomb=new Map();[...(disk.suppr||[]),...TOMB].forEach(t=>{if(!tomb.has(t.id)||tomb.get(t.id)<t.maj)tomb.set(t.id,t.maj)});
  const map=new Map();[...normBase(disk.articles||[]),...BASE].forEach(a=>{const c=map.get(a.id);if(!c||(a.maj||0)>=(c.maj||0))map.set(a.id,a)});
  const cutoff=Date.now()-120*864e5;
  return{articles:[...map.values()].filter(a=>!(tomb.has(a.id)&&tomb.get(a.id)>=(a.maj||0))),suppr:[...tomb].filter(([,m])=>m>cutoff).map(([id,maj])=>({id,maj}))};
}
function applyMerge(m){const byId=new Map(BASE.map(a=>[a.id,a]));
  BASE=m.articles.map(a=>{const l=byId.get(a.id);if(l){if(l!==a)Object.assign(l,a);return l}return a});resnap()}
const libDoc=m=>JSON.stringify({format:"prescrire-bibliotheque",version:8,articles:m.articles,suppr:m.suppr});
function parseLib(txt){try{const d=JSON.parse(txt);return Array.isArray(d)?{articles:d,suppr:[]}:{articles:d.articles||[],suppr:d.suppr||[]}}catch(e){return null}}
let sbT=null;
function saveBase(){stamp();clearTimeout(sbT);sbT=setTimeout(flushBase,T?400:50)}
async function flushBase(){
  sbT=null;
  if(!T){let disk={};try{disk=parseLib(localStorage.getItem(KEY_B)||"[]")||{}}catch(e){}
    const m=mergeLib(disk);applyMerge(m);TOMB=[];try{localStorage.setItem(KEY_B,libDoc(m))}catch(e){}return}
  if(!LIB_PATH)return;
  if(FLUSHING){FLUSH_AGAIN=true;return}
  FLUSHING=true;
  try{
    /* Lecture, fusion, écriture, puis relecture de contrôle : si un autre poste a écrit
       au même instant, on recommence pour ne perdre aucune modification. */
    for(let k=0;k<5;k++){
      const txt=await inv("read_text",{path:LIB_PATH}).catch(()=>null);
      const m=mergeLib(txt?parseLib(txt)||{}:{});applyMerge(m);
      await inv("write_text",{path:LIB_PATH,content:libDoc(m)});
      await new Promise(r=>setTimeout(r,150+Math.random()*350));
      const back=parseLib(await inv("read_text",{path:LIB_PATH}).catch(()=>"")||"");
      if(back&&covers(back)){TOMB=[];break}
    }
    LIB_MTIME=await inv("mtime",{path:LIB_PATH})||0;LIB_ERR="";
  }catch(e){LIB_ERR=String(e);toast("La bibliothèque partagée n'a pas pu être enregistrée : "+LIB_ERR,6000)}
  FLUSHING=false;libStatus();
  if(FLUSH_AGAIN){FLUSH_AGAIN=false;flushBase()}
}
let FLUSHING=false,FLUSH_AGAIN=false;
function covers(d){const dm=new Map((d.articles||[]).map(a=>[a.id,a.maj||0])),ds=new Set((d.suppr||[]).map(t=>t.id));
  return BASE.every(a=>dm.has(a.id)&&dm.get(a.id)>=(a.maj||0))&&TOMB.every(t=>ds.has(t.id))}
async function reloadLib(force){
  if(!T||!LIB_PATH||sbT||FLUSHING)return;
  try{const mt=await inv("mtime",{path:LIB_PATH});if(!force&&(!mt||mt===LIB_MTIME))return;
    const txt=await inv("read_text",{path:LIB_PATH});const d=parseLib(txt);if(!d)return;
    applyMerge(mergeLib(d));LIB_MTIME=mt||0;LIB_ERR="";
    if(!covers(d))flushBase();
    if($("#lb-list"))libList();const n=S.sel&&IDX[S.sel]&&IDX[S.sel].n;if(n&&n.kind==="p")libHint(n);libStatus();
  }catch(e){LIB_ERR=String(e);libStatus()}
}

/* ======================================================================
   Index de l'arbre et totaux
   ====================================================================== */
let IDX={};
function reindex(){
  IDX={};
  (function walk(arr,parent,prefix,depth){arr.forEach((n,i)=>{
    const nr=prefix?prefix+"."+(i+1):String(i+1).padStart(2,"0");
    IDX[n.id]={n,parent,arr,i,nr,depth};
    if(n.kind==="g")walk(n.children,n,nr,depth+1);
  })})(S.tree,null,"",0);
}
const lineT=n=>num(n.qte)*num(n.prix);
const baseT=n=>n.kind==="p"?(n.pse?0:lineT(n)):n.children.reduce((s,c)=>s+baseT(c),0);
const pseT=n=>n.kind==="p"?(n.pse?lineT(n):0):n.children.reduce((s,c)=>s+pseT(c),0);
const hasMode=(n,pse)=>n.kind==="p"?!!n.pse===pse:n.children.some(c=>hasMode(c,pse));
const ancestors=id=>{const a=[];let p=IDX[id]&&IDX[id].parent;while(p){a.unshift(p);p=IDX[p.id].parent}return a};
const isDesc=(id,anc)=>{let p=IDX[id]&&IDX[id].parent;while(p){if(p.id===anc)return true;p=IDX[p.id].parent}return false};
const countP=n=>n.kind==="p"?1:n.children.reduce((s,c)=>s+countP(c),0);
const rootOf=id=>{const a=ancestors(id);return a.length?a[0]:IDX[id].n};
const lotRef=n=>{const l=rootOf(n.id);return "Lot "+IDX[l.id].nr+" — "+l.nom};
const flatP=arr=>{const o=[];walkP(arr,n=>o.push(n));return o};

/* ======================================================================
   Lieux et quantités (formules : S surface, P périmètre, H hauteur)
   ====================================================================== */
const LO=name=>S.lieux.find(l=>l.nom===name);
const isExpr=s=>/[^\d.,\s]/.test(String(s??""));
function evalQ(expr,lieu){
  let e=String(expr??"").replace(/\s+/g,"");if(!e)return{v:0};
  e=e.replace(/,/g,".").replace(/[x×]/g,"*").replace(/÷/g,"/");
  const names={s:"la surface",p:"le périmètre",h:"la hauteur"};
  try{
    e=e.replace(/[SPH]/gi,m=>{const k=m.toLowerCase();
      if(!lieu)throw new Error("S, P et H ne s'utilisent qu'avec un lieu précis");
      const li=LO(lieu),v=li?num(li[k]):0;
      if(!v)throw new Error(`Renseignez ${names[k]} de « ${lieu} » (bouton Lieux)`);
      return "("+v+")"});
  }catch(err){return{v:0,err:err.message}}
  if(!/^[0-9.+\-*/()]+$/.test(e))return{v:0,err:"Formule non reconnue"};
  try{const v=Function('"use strict";return('+e+")")();if(!isFinite(v))return{v:0,err:"Formule incomplète"};return{v:r2(v)}}
  catch(x){return{v:0,err:"Formule incomplète"}}
}
function syncQ(n){if(n.lieux.length>1)n.qte=r2(n.lieux.reduce((s,l)=>s+num(n.ql[l]),0))}
function qOf(n,l){return n.lieux.length>1?num(n.ql[l]):num(n.qte)}
function recalc(n){
  if(n.lieux.length>1){n.lieux.forEach(l=>{if(n.qlx[l]){const r=evalQ(n.qlx[l],l);if(!r.err)n.ql[l]=r.v}});syncQ(n)}
  else if(n.qx){const r=evalQ(n.qx,n.lieux[0]);if(!r.err)n.qte=r.v}
}
function recalcAll(){walkP(S.tree,recalc)}
function setQ(n,raw){
  if(isExpr(raw)){n.qx=raw;const r=evalQ(raw,n.lieux[0]);if(!r.err)n.qte=r.v;return r}
  n.qx="";n.qte=raw.trim()===""?"":num(raw);return{v:n.qte};
}
function setQL(n,l,raw){
  let r;
  if(isExpr(raw)){n.qlx[l]=raw;r=evalQ(raw,l);if(!r.err)n.ql[l]=r.v}
  else{delete n.qlx[l];n.ql[l]=num(raw);r={v:n.ql[l]}}
  syncQ(n);return r;
}
function toggleLieu(n,l){
  const before=n.lieux.length;
  if(n.lieux.includes(l)){
    n.lieux=n.lieux.filter(z=>z!==l);delete n.ql[l];delete n.qlx[l];
    if(n.lieux.length===1){const k=n.lieux[0];n.qte=num(n.ql[k]);n.qx=n.qlx[k]||""}else if(n.lieux.length>1)syncQ(n);
  }else{
    if(before===1){const k=n.lieux[0];n.ql[k]=num(n.qte);if(n.qx)n.qlx[k]=n.qx;else delete n.qlx[k]}
    const order=S.lieux.map(z=>z.nom);
    n.lieux=[...n.lieux,l].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    if(n.lieux.length>1){if(n.ql[l]==null)n.ql[l]=0;syncQ(n)}
    else if(before===0&&n.qx)recalc(n);
  }
}
function locTxt(n){return n.lieux.length>1?n.lieux.map(l=>`${l} (${qf.format(qOf(n,l))} ${n.u})`).join(", "):n.lieux.join(", ")}
function dimTxt(li){if(!li)return"";const a=[];if(num(li.s))a.push("S "+qf.format(num(li.s)));if(num(li.p))a.push("P "+qf.format(num(li.p)));if(num(li.h))a.push("H "+qf.format(num(li.h)));return a.join(" · ")}
function qBtns(lieu,target){const li=LO(lieu);if(!li)return"";let h="";
  if(num(li.s))h+=`<button class="mini" data-qins="S" data-qt="${esc(target)}" title="Surface au sol">sol</button>`;
  if(num(li.p)&&num(li.h))h+=`<button class="mini" data-qins="P*H" data-qt="${esc(target)}" title="Périmètre × hauteur">murs</button>`;
  if(num(li.p))h+=`<button class="mini" data-qins="P" data-qt="${esc(target)}" title="Périmètre (plinthes…)">pér.</button>`;
  return h}

$("#tree").addEventListener("click",e=>{

let dragId=null;
const treeEl=$("#tree");
treeEl.addEventListener("dragstart",e=>{const r=e.target.closest(".row");if(!r)return;dragId=r.dataset.id;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
treeEl.addEventListener("dragend",()=>{dragId=null;clearDrop();document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"))});
function clearDrop(){document.querySelectorAll(".drop-before,.drop-after,.drop-in").forEach(x=>x.classList.remove("drop-before","drop-after","drop-in"))}
function zone(e,r){
  const t=IDX[r.dataset.id].n,b=r.getBoundingClientRect(),y=(e.clientY-b.top)/b.height;
  if(t.kind==="g"){if(y<.28)return"before";if(y>.72&&!(t.children.length&&S.open[t.id]!==false))return"after";return"in"}
  return y<.5?"before":"after";
}
function validDrop(tid,z){
  if(!dragId||tid===dragId||isDesc(tid,dragId))return false;
  const d=IDX[dragId].n,t=IDX[tid];
  if(z!=="in"&&!t.parent&&d.kind==="p")return false;

}
treeEl.addEventListener("dragover",e=>{

/* ======================================================================
   Bibliothèque : lien avec la fiche
   ====================================================================== */
const lotNameOf=n=>{reindex();return IDX[n.id]?rootOf(n.id).nom:""};
function baseOf(n){return BASE.find(a=>a.id===n.bid)||BASE.find(a=>norm(a.nom)===norm(n.nom))||null}
function baseDiff(n,a){if(!a)return[];const d=[];if(a.cat!==n.cat)d.push("catégorie");if(a.u!==n.u)d.push("unité");if(r2(num(a.prix))!==r2(num(n.prix)))d.push("prix");if((a.desc||"")!==(n.desc||""))d.push("descriptif");return d}
function autoBase(n){
  const nm=(n.nom||"").trim();if(!nm)return;
  let a=BASE.find(z=>norm(z.nom)===norm(nm));
  if(a){n.bid=a.id;libHint(n);return}
  a={id:uid(),nom:nm,lot:lotNameOf(n),cat:n.cat,u:n.u,prix:num(n.prix),desc:n.desc||""};
  BASE.push(a);saveBase();n.bid=a.id;n.prixBase=a.prix;LIVE=n.id;save();
  toast(`« ${nm} » est ajoutée à la bibliothèque.`);libHint(n);
}
function syncLive(n){
  if(LIVE!==n.id)return;
  const a=BASE.find(z=>z.id===n.bid);if(!a){LIVE=null;return}
  Object.assign(a,{nom:(n.nom||"").trim()||a.nom,cat:n.cat,u:n.u,prix:num(n.prix),desc:n.desc||""});n.prixBase=a.prix;saveBase();

function libHint(n){

  if(!a){h.className="libhint new";h.innerHTML=`<span class="dotc"></span><span>Nouvel article : ajouté à la bibliothèque en quittant ce champ.</span>`;return}
  if(LIVE===n.id){h.className="libhint new";h.innerHTML=`<span class="dotc"></span><span>Nouvel article de la bibliothèque : vos saisies y sont reportées.</span>`;return}
  const d=baseDiff(n,a);

  h.className="libhint mod";h.innerHTML=`<span class="dotc"></span><span>Adapté pour ce projet (${d.join(", ")}).</span><button class="link" id="f-updb">Reporter dans la bibliothèque</button><button class="link" id="f-revert">Revenir à la bibliothèque</button>`;
  $("#f-updb").onclick=()=>{Object.assign(a,{cat:n.cat,u:n.u,prix:num(n.prix),desc:n.desc});n.prixBase=a.prix;n.bid=a.id;saveBase();save();toast("Bibliothèque mise à jour.");libHint(n)};
  $("#f-revert").onclick=()=>{Object.assign(n,{cat:a.cat,u:a.u,prix:a.prix,prixBase:a.prix,desc:a.desc,bid:a.id});commit();renderFiche()};
}

function renderFiche(){

  if(!x){$("#fiche-h").textContent="Fiche";el.innerHTML=`<div class="empty">Sélectionnez une prestation dans la colonne de gauche, ou créez un lot avec « + Lot ».</div>`;return}
  const n=x.n,anc=ancestors(n.id);

/* Autocomplétion : articles du lot en cours d'abord */
let acItems=[],acI=-1;
function acShow(){
  const i=$("#f-nom"),L=$("#ac-list");if(!i)return;
  const q=norm(i.value);if(!q){acHide();return}
  const words=q.split(/\s+/),n=IDX[S.sel]&&IDX[S.sel].n,lot=n?norm(lotNameOf(n)):"";
  const same=a=>lot&&a.lot&&(norm(a.lot)===lot||lot.includes(norm(a.lot))||norm(a.lot).includes(lot));
  acItems=BASE.filter(d=>{const t=norm(d.nom);return words.every(w=>t.includes(w))})
    .sort((a,b)=>(same(b)-same(a))||(norm(a.nom).startsWith(words[0])?-1:0)-(norm(b.nom).startsWith(words[0])?-1:0)||a.nom.localeCompare(b.nom,"fr")).slice(0,10);
  if(!acItems.length||(acItems.length===1&&norm(acItems[0].nom)===q)){acHide();return}
  acI=-1;
  L.innerHTML=acItems.map((d,k)=>`<div class="ac-item" data-k="${k}" role="option"><span class="n">${hl(d.nom,words)}</span><span class="m">${esc(d.u)} · ${nf.format(d.prix)} €</span>${d.lot?`<span class="l">${esc(d.lot)}</span>`:""}</div>`).join("");
  L.hidden=false;i.setAttribute("aria-expanded","true");
  L.onmousedown=e=>{const it=e.target.closest(".ac-item");if(it){e.preventDefault();acPick(+it.dataset.k)}};
}
function hl(s,words){let out="";const t=norm(s),m=new Array(s.length).fill(false);
  words.forEach(w=>{if(!w)return;let p=t.indexOf(w);while(p>-1){for(let k=p;k<p+w.length;k++)m[k]=true;p=t.indexOf(w,p+1)}});
  for(let k=0;k<s.length;k++){const c=esc(s[k]);out+=m[k]&&(k===0||!m[k-1])?"<mark>"+c:c;if(m[k]&&(k===s.length-1||!m[k+1]))out+="</mark>"}return out}
function acHide(){const L=$("#ac-list");if(L)L.hidden=true;const i=$("#f-nom");if(i)i.setAttribute("aria-expanded","false");acI=-1}
function acKey(e){
  const L=$("#ac-list");if(!L||L.hidden)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();acI=(acI+(e.key==="ArrowDown"?1:-1)+acItems.length)%acItems.length;
    L.querySelectorAll(".ac-item").forEach((el,k)=>el.classList.toggle("on",k===acI))}
  else if(e.key==="Enter"&&acI>-1){e.preventDefault();acPick(acI)}
  else if(e.key==="Escape")acHide();
}
function acPick(k){
  const d=acItems[k],n=IDX[S.sel].n;
  Object.assign(n,{nom:d.nom,cat:d.cat,u:d.u,prix:d.prix,prixBase:d.prix,desc:d.desc,bid:d.id});
  LIVE=null;acHide();recalc(n);commit();renderFiche();
}

function byLieu(){
  const m=new Map();S.lieux.forEach(l=>m.set(l.nom,[]));const none=[];
  walkP(S.tree,n=>{if(!n.lieux.length)none.push(n);else n.lieux.forEach(l=>{if(!m.has(l))m.set(l,[]);m.get(l).push(n)})});
  const out=[...m].filter(([,v])=>v.length);
  if(none.length)out.push(["Non localisé",none]);
  return out;
}
const indTxt=()=>{const P=S.projet;return [P.phase,P.indice?"indice "+P.indice:""].filter(Boolean).join(" · ")};
function cctpHead(sub){const P=S.projet;return`<h1>${esc(P.nom)}</h1><p class="sub">${esc([P.moa,P.adresse].filter(Boolean).join(" · "))}<br>${esc(sub)} · ${esc(indTxt())}</p>`}

function dpgfRows(arr,pse){
  return arr.map(n=>{const nr=IDX[n.id].nr;
    if(n.kind==="g")return hasMode(n,pse)?`<tr class="grp"><td class="n">${nr}</td><td colspan="5">${esc(n.nom)}</td></tr>${dpgfRows(n.children,pse)}`:"";
    if(!!n.pse!==pse)return"";
    return`<tr class="art ${S.sel===n.id?"sel":""}" data-id="${n.id}"><td class="n">${nr}</td><td>${esc(n.nom||"Prestation sans nom")}${n.lieux.length?`<div class="hint">${esc(locTxt(n))}</div>`:""}</td><td class="c">${esc(n.u)}</td><td class="r">${n.qte===""?"":qf.format(num(n.qte))}</td><td class="r ${num(n.prix)?"":"zero"}">${nf.format(num(n.prix))}</td><td class="r">${nf.format(lineT(n))}</td></tr>`;
  }).join("");
}
function dpgfLieux(){
  const L=byLieu();
  if(!L.length)return`<div class="empty">Aucune prestation n'est encore localisée.</div>`;
  if(S.lieu!=="__recap"&&!L.some(([l])=>l===S.lieu))S.lieu=L[0][0];
  const qL=(n,l)=>l==="Non localisé"?num(n.qte):qOf(n,l);
  const amt=(l,arr)=>arr.reduce((s,n)=>s+(n.pse?0:qL(n,l)*num(n.prix)),0);
  const bar=`<div class="lotbar">${L.map(([l,a])=>`<button class="chip" data-lieu="${esc(l)}" aria-pressed="${l===S.lieu}">${esc(l)} <span class="hint">${a.length}</span></button>`).join("")}<button class="chip" data-lieu="__recap" aria-pressed="${S.lieu==="__recap"}">Récapitulatif</button></div>`;
  if(S.lieu==="__recap"){
    const tot=L.reduce((s,[l,a])=>s+amt(l,a),0);
    return bar+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>Lieu</th><th>Niveau</th><th class="r">Surface</th><th class="r">Montant HT</th><th class="r">€/m²</th></tr></thead><tbody>`+
      L.map(([l,a])=>{const li=LO(l),s=li?num(li.s):0,m=amt(l,a);return`<tr class="art" data-lieu="${esc(l)}"><td>${esc(l)}</td><td class="tag">${esc(li?li.niv:"")}</td><td class="r">${s?qf.format(s)+" m²":""}</td><td class="r">${eur(m)}</td><td class="r">${s?nf.format(m/s):""}</td></tr>`}).join("")+
      `<tr class="tot st"><td>Total HT (hors PSE)</td><td></td><td></td><td class="r">${eur(tot)}</td><td></td></tr></tbody></table></div>`;
  }
  const arr=L.find(([l])=>l===S.lieu)[1];
  const rows=arr.map(n=>{const q=qL(n,S.lieu),t=q*num(n.prix),multi=n.lieux.length>1&&S.lieu!=="Non localisé";
    return`<tr class="art ${S.sel===n.id?"sel":""}" data-id="${n.id}"><td class="n">${IDX[n.id].nr}</td><td>${esc(n.nom||"Prestation sans nom")} ${n.pse?'<span class="pse">PSE</span>':""}<div class="tag">${esc(lotRef(n))}</div>${multi?`<div class="hint">Part de ${qf.format(num(n.qte))} ${esc(n.u)} au total</div>`:""}</td><td class="c">${esc(n.u)}</td><td class="r ${q?"":"zero"}">${qf.format(q)}</td><td class="r">${nf.format(num(n.prix))}</td><td class="r">${nf.format(t)}</td></tr>`}).join("");
  return bar+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>N°</th><th>Désignation</th><th class="c">U</th><th class="r">Qté</th><th class="r">PU HT</th><th class="r">Total HT</th></tr></thead><tbody>
  <tr class="lot"><td></td><td colspan="5">${esc(S.lieu)}</td></tr>${rows}
  <tr class="st"><td></td><td colspan="4">Total ${esc(S.lieu)} (hors PSE)</td><td class="r">${nf.format(amt(S.lieu,arr))}</td></tr></tbody></table></div>`;
}
function dpgfLots(){
  if(S.lot!=="recap"&&!IDX[S.lot])S.lot="recap";
  const bar=`<div class="lotbar">${S.tree.map(l=>`<button class="chip" data-lot="${l.id}" aria-pressed="${S.lot===l.id}">${IDX[l.id].nr} ${esc(l.nom)}</button>`).join("")}<button class="chip" data-lot="recap" aria-pressed="${S.lot==="recap"}">Récapitulatif</button></div>`;

  let body;

    const ht=S.tree.reduce((s,l)=>s+baseT(l),0),pt=S.tree.reduce((s,l)=>s+pseT(l),0),tva=ht*S.tva/100;
    body=`<table class="dpgf"><thead><tr><th>Lot</th><th>Désignation</th><th class="r">Base HT</th>${pt?'<th class="r">PSE HT</th>':""}</tr></thead><tbody>`+
      S.tree.map(l=>`<tr class="art" data-lot="${l.id}"><td class="n">${IDX[l.id].nr}</td><td>${esc(l.nom)}</td><td class="r">${eur(baseT(l))}</td>${pt?`<td class="r">${pseT(l)?eur(pseT(l)):""}</td>`:""}</tr>`).join("")+
      `<tr class="tot st"><td></td><td>Total HT</td><td class="r">${eur(ht)}</td>${pt?`<td class="r">${eur(pt)}</td>`:""}</tr>
       <tr class="tot"><td></td><td>TVA <select id="tva" aria-label="Taux de TVA">${[20,10,5.5].map(v=>`<option value="${v}" ${v==S.tva?"selected":""}>${String(v).replace(".",",")} %</option>`).join("")}</select></td><td class="r">${eur(tva)}</td>${pt?`<td class="r">${eur(pt*S.tva/100)}</td>`:""}</tr>
       <tr class="ttc"><td></td><td>Total TTC</td><td class="r">${eur(ht+tva)}</td>${pt?`<td class="r">${eur(pt*(1+S.tva/100))}</td>`:""}</tr>
       ${pt?`<tr class="tot"><td></td><td>Total base + PSE TTC</td><td class="r" colspan="2">${eur((ht+pt)*(1+S.tva/100))}</td></tr>`:""}</tbody></table>`;
  }else{

  }
  return bar+`<div class="tblwrap">${body}</div>`;
}

const tsvN=v=>(Math.round(num(v)*100)/100).toFixed(2).replace(".",",");
function dpgfTSV(){
  const L=["N°\tDésignation\tU\tQté\tPU HT\tTotal HT"];
  const rec=(arr,pse)=>arr.forEach(n=>{const nr=IDX[n.id].nr;
    if(n.kind==="g"){if(hasMode(n,pse)){L.push(`${nr}\t${n.nom}\t\t\t\t`);rec(n.children,pse)}}
    else if(!!n.pse===pse)L.push(`${nr}\t${(n.nom||"").replace(/\t/g," ")}\t${n.u}\t${n.qte===""?"":String(num(n.qte)).replace(".",",")}\t${tsvN(n.prix)}\t${tsvN(lineT(n))}`)});
  S.tree.forEach(l=>{const nr=IDX[l.id].nr;L.push(`${nr}\tLOT ${nr} — ${l.nom.toUpperCase()}\t\t\t\t`);rec(l.children,false);L.push(`\tSous-total lot ${nr}\t\t\t\t${tsvN(baseT(l))}`);
    if(hasMode(l,true)){L.push(`\tPrestations supplémentaires éventuelles\t\t\t\t`);rec(l.children,true);L.push(`\tSous-total PSE lot ${nr}\t\t\t\t${tsvN(pseT(l))}`)}L.push("")});
  const ht=S.tree.reduce((s,l)=>s+baseT(l),0);
  L.push(`\tTotal HT\t\t\t\t${tsvN(ht)}`,`\tTVA ${String(S.tva).replace(".",",")} %\t\t\t\t${tsvN(ht*S.tva/100)}`,`\tTotal TTC\t\t\t\t${tsvN(ht*(1+S.tva/100))}`);
  return L.join("\n");
}

const dlP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
const pjoin=(dir,name)=>{if(!dir)return name;const sep=dir.includes("\\")&&!dir.includes("/")?"\\":"/";return dir.replace(/[\\/]+$/,"")+sep+name};
const pdir=p=>String(p||"").replace(/[\\/][^\\/]*$/,"");
const pbase=p=>String(p||"").split(/[\\/]/).pop();
async function blobB64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64Bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
let LASTDIR=null;
async function saveFile(filename,blob){
  if(T){
    const ext=(filename.split(".").pop()||"").toLowerCase();
    const path=await T.dialog.save({defaultPath:pjoin(LASTDIR||(DIRS&&DIRS.documents)||"",filename),filters:[{name:ext.toUpperCase(),extensions:[ext]}]});
    if(!path)return false;

    catch(e){toast("Enregistrement impossible : "+e,6000);return false}
  }
  const dl=await dlP;
  if(dl){
    try{await dl.save({filename,data:blob});toast("Fichier enregistré : "+filename);return true}
    catch(e){const c=e&&e.code;if(c==="declined")return false;toast(c==="rate_limited"?"Une demande d'enregistrement est déjà ouverte.":"Enregistrement impossible ici.");return false}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);

}

const lockOf=p=>pjoin(pdir(p),"."+pbase(p)+".verrou");
async function readLock(p){try{const t=await inv("read_text",{path:lockOf(p)});const l=JSON.parse(t);return l&&l.par?l:null}catch(e){return null}}

function showDiff(id){
  const snap=S.indices.find(x=>x.id===id);if(!snap)return;
  reindex();
  const mapOld=new Map(),nrOld=new Map();
  (function w(arr,prefix){arr.forEach((n,i)=>{const nr=prefix?prefix+"."+(i+1):String(i+1).padStart(2,"0");if(n.kind==="g")w(n.children,nr);else{mapOld.set(n.id,n);nrOld.set(n.id,nr)}})})(snap.tree,"");
  const cur=flatP(S.tree),add=[],mod=[],del=[];
  const f=(v)=>qf.format(num(v));
  cur.forEach(n=>{const o=mapOld.get(n.id);if(!o){add.push(n);return}
    const ch=[];
    if(o.nom!==n.nom)ch.push(`Intitulé : ${o.nom} → ${n.nom}`);
    if(r2(num(o.qte))!==r2(num(n.qte)))ch.push(`Quantité : ${f(o.qte)} → ${f(n.qte)} ${n.u}`);
    if(o.u!==n.u)ch.push(`Unité : ${o.u} → ${n.u}`);
    if(r2(num(o.prix))!==r2(num(n.prix)))ch.push(`Prix unitaire : ${nf.format(num(o.prix))} → ${nf.format(num(n.prix))} €`);
    if((o.desc||"")!==(n.desc||""))ch.push("Descriptif modifié");
    if((o.lieux||[]).join("|")!==n.lieux.join("|"))ch.push(`Localisation : ${(o.lieux||[]).join(", ")||"aucune"} → ${n.lieux.join(", ")||"aucune"}`);
    if(!!o.pse!==!!n.pse)ch.push(n.pse?"Passée en PSE":"Sortie des PSE");
    if((o.fin||"")!==(n.fin||"")||!!o.finOn!==!!n.finOn)ch.push("Finition modifiée");
    if(nrOld.get(n.id)!==IDX[n.id].nr)ch.push(`Numéro : ${nrOld.get(n.id)} → ${IDX[n.id].nr}`);
    if(ch.length)mod.push([n,ch]);mapOld.delete(n.id)});
  mapOld.forEach((o,id)=>del.push([o,nrOld.get(id)]));
  const ht=S.tree.reduce((s,l)=>s+baseT(l),0);
  const body=`<p>Montant HT : ${eur(snap.ht)} à l'indice ${esc(snap.indice)} → ${eur(ht)} aujourd'hui (${pf.format(snap.ht?(ht-snap.ht)/snap.ht*100:0)} %).</p>
   <div class="difflist">
   <h4>Prestations ajoutées (${add.length})</h4>${add.map(n=>`<div class="d"><span>${IDX[n.id].nr}</span><span>${esc(n.nom)}<small>${qf.format(num(n.qte))} ${esc(n.u)} · ${eur(lineT(n))}</small></span></div>`).join("")||'<p class="hint">Aucune</p>'}
   <h4>Prestations supprimées (${del.length})</h4>${del.map(([o,nr])=>`<div class="d"><span>${nr}</span><span>${esc(o.nom)}</span></div>`).join("")||'<p class="hint">Aucune</p>'}

   </div>`;
  openModal(`Changements depuis l'indice ${snap.indice}`,body,`<button class="btn" id="df-back">Retour au projet</button><button class="btn primary" data-m="close">Fermer</button>`,{sub:"figé le "+snap.date});

const cv=v=>{if(v==null)return"";if(typeof v==="object"){if(v instanceof Date)return v.toLocaleDateString("fr-FR");if("result" in v)return v.result??"";if(v.richText)return v.richText.map(r=>r.text).join("");if(v.text)return v.text;if("formula" in v)return"";}return v};

async function importLibXlsx(file){
  if(!needLib("ExcelJS"))return;
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  let added=0,upd=0,sheets=0;
  wb.eachSheet(ws=>{
    let hr=0,map={};
    for(let r=1;r<=Math.min(20,ws.rowCount);r++){const m={};ws.getRow(r).eachCell((c,col)=>{const t=norm(str(c.value));if(!t)return;
      if(/^(designation|libelle|intitule|nom|article|prestation|ouvrage)/.test(t))m.nom??=col;
      else if(/^(u|unite|unites)$/.test(t))m.u??=col;
      else if(/^(pu|p\.u|prix)/.test(t))m.prix??=col;
      else if(/^(descriptif|description|texte|prescription|cctp)/.test(t))m.desc??=col;
      else if(/^lot/.test(t))m.lot??=col;
      else if(/^categ/.test(t))m.cat??=col});
      if(m.nom){hr=r;map=m;break}}
    if(!hr)return;sheets++;
    const sheetLot=/^r[ée]cap/i.test(ws.name)?"":ws.name.replace(/^lot\s*[\d.]+\s*[-–—]?\s*/i,"").trim();
    for(let r=hr+1;r<=ws.rowCount;r++){
      const row=ws.getRow(r),nom=str(row.getCell(map.nom).value);
      if(!nom||/^(sous-total|total|lot\s|prestations suppl|tva)/i.test(nom))continue;
      const u=map.u?normU(str(row.getCell(map.u).value)):"",prix=map.prix?num(cv(row.getCell(map.prix).value)):0,desc=map.desc?str(row.getCell(map.desc).value):"";
      if(!u&&!prix&&!desc)continue;
      const lot=map.lot?str(row.getCell(map.lot).value):sheetLot,cat=map.cat?str(row.getCell(map.cat).value):"";
      const z=BASE.find(b=>norm(b.nom)===norm(nom));
      if(z){if(u)z.u=u;if(prix)z.prix=prix;if(desc)z.desc=desc;if(lot)z.lot=lot;if(cat&&CATS.includes(cat))z.cat=cat;upd++}
      else{BASE.push({id:uid(),nom,lot,cat:CATS.includes(cat)?cat:CATS[0],u:u||"U",prix,desc});added++}
    }
  });
  saveBase();libList();libEdit();
  if(!sheets)return toast("Aucune colonne « Désignation » trouvée dans ce fichier.",4000);
  toast(`Import terminé : ${added} article(s) ajouté(s), ${upd} mis à jour.`,4000);
}

      for(let i=1;i<=(pse?4:3);i++)x.getCell(i).border={bottom:thin};k++;
    });

      d.getCell(4).value={formula:`D${rHT}+D${rTV}`,result:cons?0:pt*(1+S.tva/100)};d.getCell(4).numFmt=MONEY;
    }
    for(let i=1;i<=(pse?4:3);i++)d.getCell(i).border={top:{style:"medium",color:{argb:ink}}};
    let nr=rTTC+2;
    if(links.length&&links.length<S.tree.length){const n=rc.getCell(`B${nr}`);n.value="Récapitulatif limité aux lots inclus dans ce classeur.";n.font={name:FONT,size:9,italic:true,color:{argb:"FF5B6674"}};nr++}

  return String(t??"").split("\n").map((line,i)=>(i?"<w:r><w:br/></w:r>":"")+`<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:""}<w:t xml:space="preserve">${xe(line)}</w:t></w:r>`).join("")}

  return`<w:p>${pp?`<w:pPr>${pp}</w:pPr>`:""}${content}</w:p>`}

<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>

${st("Heading3","heading 3",'<w:keepNext/><w:spacing w:before="240" w:after="60"/><w:jc w:val="left"/><w:outlineLvl w:val="2"/>','<w:b/><w:sz w:val="21"/><w:szCs w:val="21"/>')}

${st("Intro","Prescrire - généralités",'<w:spacing w:after="120"/>','<w:i/>')}
${st("Header","header",'<w:pBdr><w:bottom w:val="single" w:sz="4" w:space="4" w:color="9AA3AE"/></w:pBdr><w:jc w:val="left"/>','<w:color w:val="5B6674"/><w:sz w:val="16"/><w:szCs w:val="16"/>')}
${st("Footer","footer",'<w:jc w:val="left"/>','<w:color w:val="5B6674"/><w:sz w:val="16"/><w:szCs w:val="16"/>')}

/* Fenêtre d'export unique */
const X={doc:"dpgf",type:"moa",scope:"all",lots:new Set(),recap:true};
function openExport(){
  reindex();
  if(!S.tree.length)return toast("Aucun lot à exporter.");
  if(!X.lots.size){const sel=S.sel&&IDX[S.sel]?rootOf(S.sel):null;if(sel)X.lots.add(sel.id)}
  [...X.lots].forEach(id=>{if(!IDX[id])X.lots.delete(id)});
  if(S.tab==="cctp")X.doc="docx";else if(S.tab==="dpgf")X.doc="dpgf";
  openModal("Exporter",`
    <fieldset><legend>Document</legend><div class="optrow">
      <label class="opt"><input type="radio" name="x-doc" value="dpgf" ${X.doc==="dpgf"?"checked":""}><span><b>DPGF</b><small>Classeur Excel, un onglet par lot</small></span></label>
      <label class="opt"><input type="radio" name="x-doc" value="docx" ${X.doc==="docx"?"checked":""}><span><b>CCTP</b><small>Document Word avec page de garde et sommaire</small></span></label></div></fieldset>
    <fieldset id="x-dest"><legend>Destinataire</legend><div class="optrow">
      <label class="opt"><input type="radio" name="x-type" value="moa" ${X.type==="moa"?"checked":""}><span><b>Maître d'ouvrage</b><small>Prix et montants de l'estimation</small></span></label>
      <label class="opt"><input type="radio" name="x-type" value="cons" ${X.type==="cons"?"checked":""}><span><b>Entreprises</b><small>Prix unitaires vides, totaux par formules</small></span></label></div></fieldset>
    <fieldset><legend>Contenu</legend><div class="optrow">
      <label class="opt"><input type="radio" name="x-scope" value="all" ${X.scope==="all"?"checked":""}><span><b>Tous les lots</b></span></label>
      <label class="opt"><input type="radio" name="x-scope" value="some" ${X.scope==="some"?"checked":""}><span><b>Lots choisis</b></span></label></div>
      <div class="lotlist" id="x-lots">${S.tree.map(l=>`<label><input type="checkbox" data-xl="${l.id}"><span class="n">${IDX[l.id].nr}</span><span>${esc(l.nom)}</span><span class="a">${nf.format(baseT(l))}</span></label>`).join("")}
        <label class="recap-opt" id="x-recapl"><input type="checkbox" id="x-recap" ${X.recap?"checked":""}><span class="n">Σ</span><span>Récapitulatif (total HT, TVA, TTC)</span><span></span></label></div></fieldset>`,
    `<span class="x-sum" id="x-sum"></span><button class="btn" data-m="cancel">Annuler</button><button class="btn primary" id="x-go">Exporter</button>`,{focus:false});
  const body=$("#m-body");
  const sync=()=>{
    const all=X.scope==="all",docx=X.doc==="docx";
    $("#x-dest").hidden=docx;$("#x-recapl").hidden=docx;
    body.querySelectorAll("[data-xl]").forEach(c=>{c.checked=all||X.lots.has(c.dataset.xl);c.disabled=all;c.closest("label").style.opacity=all?.55:1});
    const ids=[...body.querySelectorAll("[data-xl]:checked")].map(c=>c.dataset.xl),rc=!docx&&$("#x-recap").checked;
    const parts=[...ids.map(id=>"Lot "+IDX[id].nr),...(rc?["Récapitulatif"]:[])],n=parts.length;
    $("#x-sum").textContent=!n?"Rien de sélectionné":docx?`Un document Word : ${ids.length===S.tree.length?"tous les lots":parts.join(", ")}`:`Un classeur de ${n} onglet${n>1?"s":""} : ${parts.join(", ")}`;
    $("#x-go").disabled=!(docx?ids.length:n);
  };
  body.onchange=e=>{const t=e.target;
    if(t.name==="x-doc")X.doc=t.value;if(t.name==="x-type")X.type=t.value;if(t.name==="x-scope")X.scope=t.value;
    if(t.dataset.xl)t.checked?X.lots.add(t.dataset.xl):X.lots.delete(t.dataset.xl);
    if(t.id==="x-recap")X.recap=t.checked;sync()};
  sync();
  $("#x-go").onclick=()=>{
    const ids=[...body.querySelectorAll("[data-xl]:checked")].map(c=>c.dataset.xl),rc=$("#x-recap").checked;closeModal();
    const p=X.doc==="docx"?exportDocx(ids):exportXlsx(X.type,ids,rc);
    p.catch(e=>toast("Export impossible : "+(e&&e.message||e),5000));
  };
}

const SEUIL=20;

const oLine=(o,n)=>o.pu[n.id]!=null?num(o.pu[n.id])*num(n.qte):null;
const oBase=(o,l)=>flatP([l]).reduce((s,n)=>s+(n.pse?0:(oLine(o,n)||0)),0);
const oPse=(o,l)=>flatP([l]).reduce((s,n)=>s+(n.pse?(oLine(o,n)||0):0),0);
function ecart(v,ref){if(!ref)return"";const p=(v-ref)/ref*100,c=p<-SEUIL?"lo":p>SEUIL?"hi":"eq";return`<span class="ec ${c}">${pf.format(p)} %</span>`}
function offresHTML(){
  const O=S.offres;
  let h=`<div class="out-tools" style="border-bottom:1px solid var(--line-soft)"><button class="btn primary" id="of-imp">Importer une offre…</button>
    ${O.map(o=>`<span class="offchip">${esc(o.nom)}<button data-of="${o.id}" title="Renommer ou retirer">Modifier</button></span>`).join("")}
    <span style="flex:1"></span>${O.length?'<button class="btn" id="of-exp">Exporter l\'analyse</button>':""}</div>`;
  if(!O.length)return h+`<div class="empty"><p><b>Analyse des offres</b></p><p>1. Exportez la DPGF « Entreprises » et envoyez-la aux entreprises consultées.<br>2. Quand elles vous la renvoient remplie, importez chaque fichier ici.<br>3. Prescrire compare chaque prix à votre estimation, ligne par ligne, et signale les écarts de plus de ${SEUIL} % et les prix manquants.</p></div>`;
  reindex();
  if(S.olot!=="synth"&&!IDX[S.olot])S.olot="synth";
  h+=`<div class="lotbar"><button class="chip" data-olot="synth" aria-pressed="${S.olot==="synth"}">Synthèse</button>${S.tree.map(l=>`<button class="chip" data-olot="${l.id}" aria-pressed="${S.olot===l.id}">${IDX[l.id].nr} ${esc(l.nom)}</button>`).join("")}</div>`;
  h+=`<div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Moins-disant</span><span><i style="background:var(--danger)"></i>Plus de ${SEUIL} % sous l'estimation</span><span><i style="background:var(--warn)"></i>Plus de ${SEUIL} % au-dessus</span><span><i style="background:var(--danger-soft);border:1px solid var(--danger)"></i>Prix manquant</span></div>`;
  const ths=O.map(o=>`<th class="r">${esc(o.nom)}</th>`).join("");
  if(S.olot==="synth"){
    let rows="";const tot=O.map(()=>0);let te=0;
    S.tree.forEach(l=>{const est=baseT(l);te+=est;const vals=O.map(o=>covered(o,l)?oBase(o,l):null);const ok=vals.filter(v=>v!=null);const best=ok.length?Math.min(...ok):null;
      vals.forEach((v,i)=>{if(v!=null)tot[i]+=v});
      rows+=`<tr class="art" data-olot="${l.id}"><td class="n">${IDX[l.id].nr}</td><td>${esc(l.nom)}</td><td class="r">${nf.format(est)}</td>${vals.map(v=>v==null?`<td class="r hint">non chiffré</td>`:`<td class="r ${v===best&&ok.length>1?"best":""}">${nf.format(v)}${ecart(v,est)}</td>`).join("")}</tr>`});
    const pseEst=S.tree.reduce((s,l)=>s+pseT(l),0);
    return h+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>Lot</th><th>Désignation</th><th class="r">Estimation</th>${ths}</tr></thead><tbody>${rows}
      <tr class="tot st"><td></td><td>Total HT des lots chiffrés</td><td class="r">${nf.format(te)}</td>${tot.map(v=>`<td class="r">${nf.format(v)}${ecart(v,te)}</td>`).join("")}</tr>
      ${pseEst?`<tr><td></td><td>PSE (pour mémoire)</td><td class="r">${nf.format(pseEst)}</td>${O.map(o=>`<td class="r">${nf.format(S.tree.reduce((s,l)=>s+oPse(o,l),0))}</td>`).join("")}</tr>`:""}
      </tbody></table></div><p class="hint" style="padding:0 12px 20px">Les écarts du total ne portent que sur les lots chiffrés par chaque entreprise ; comparez lot par lot si les entreprises n'ont pas répondu aux mêmes lots.</p>`;
  }
  const l=IDX[S.olot].n,cov=O.map(o=>covered(o,l));
  const row=n=>{const ref=num(n.prix),pus=O.map(o=>o.pu[n.id]!=null?num(o.pu[n.id]):null),ok=pus.filter(v=>v!=null),best=ok.length>1?Math.min(...ok):null;
    return`<tr class="art"><td class="n">${IDX[n.id].nr}</td><td>${esc(n.nom)} ${n.pse?'<span class="pse">PSE</span>':""}<div class="hint">${qf.format(num(n.qte))} ${esc(n.u)}</div></td><td class="r">${nf.format(ref)}</td>`+
      pus.map((v,i)=>!cov[i]?`<td class="r hint">—</td>`:v==null?`<td class="miss">manquant</td>`:(()=>{const p=ref?(v-ref)/ref*100:0;return`<td class="r ${v===best?"best":""} ${p<-SEUIL?"flag-lo":p>SEUIL?"flag-hi":""}">${nf.format(v)}${ecart(v,ref)}</td>`})()).join("")+`</tr>`};
  const arts=flatP([l]);
  const base=arts.filter(n=>!n.pse),pse=arts.filter(n=>n.pse);
  return h+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>N°</th><th>Désignation</th><th class="r">PU estim.</th>${ths}</tr></thead><tbody>
    <tr class="lot"><td class="n">${IDX[l.id].nr}</td><td colspan="${2+O.length}">${esc(l.nom)} · prix unitaires HT</td></tr>${base.map(row).join("")}
    <tr class="st"><td></td><td>Total HT du lot</td><td class="r">${nf.format(baseT(l))}</td>${O.map((o,i)=>cov[i]?`<td class="r">${nf.format(oBase(o,l))}${ecart(oBase(o,l),baseT(l))}</td>`:`<td class="r hint">non chiffré</td>`).join("")}</tr>
    ${pse.length?`<tr class="psehead"><td></td><td colspan="${2+O.length}">Prestations supplémentaires éventuelles</td></tr>${pse.map(row).join("")}<tr class="st"><td></td><td>Total PSE</td><td class="r">${nf.format(pseT(l))}</td>${O.map((o,i)=>cov[i]?`<td class="r">${nf.format(oPse(o,l))}</td>`:`<td></td>`).join("")}</tr>`:""}
    </tbody></table></div>`;
}
function bindOffres(){
  const o=$("#out");
  const imp=$("#of-imp");if(imp)imp.onclick=()=>pickFile(".xlsx",f=>importOffre(f).catch(e=>toast("Import impossible : "+(e&&e.message||e),5000)));
  const ex=$("#of-exp");if(ex)ex.onclick=()=>exportAnalyse().catch(e=>toast("Export impossible : "+(e&&e.message||e),5000));
  o.onclick=e=>{
    if(S.tab!=="off")return;
    const c=e.target.closest("[data-olot]");if(c){S.olot=c.dataset.olot;persist();renderOut();return}
    const b=e.target.closest("[data-of]");if(b)editOffre(b.dataset.of);
  };
}
function editOffre(id){
  const of=S.offres.find(x=>x.id===id);if(!of)return;
  const n=Object.keys(of.pu).length;
  openModal("Offre",`<div class="f"><label for="of-nom">Entreprise</label><input type="text" id="of-nom" value="${esc(of.nom)}"></div><p class="hint">Fichier : ${esc(of.fichier)} · importé le ${esc(of.date)} · ${n} prix reconnus.</p>`,
    `<button class="btn danger" id="of-del">Retirer cette offre</button><span style="flex:1"></span><button class="btn primary" data-m="close">Fermer</button>`,{onClose:()=>renderOut()});
  $("#of-nom").oninput=e=>{of.nom=e.target.value;save()};
  let armed=false;$("#of-del").onclick=e=>{if(!armed){armed=true;e.target.classList.add("armed");e.target.textContent="Confirmer";return}S.offres.splice(S.offres.indexOf(of),1);save();closeModal()};
}
async function importOffre(file){
  if(!needLib("ExcelJS"))return;
  reindex();
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const pu={};let nom="",found=0,byNr=0;
  const arts=flatP(S.tree);
  wb.eachSheet(ws=>{
    if(/^r[ée]cap/i.test(ws.name))return;
    for(let r=1;r<=6;r++){const a=str(ws.getCell("A"+r).value),m=/^entreprise\s*:\s*(.*)$/i.exec(a);if(m){nom=nom||m[1].trim()||str(ws.getCell("B"+r).value)||str(ws.getCell("C"+r).value)}}
    let hr=0;for(let r=1;r<=20;r++){if(/^n/i.test(norm(str(ws.getCell("A"+r).value)))&&/design/.test(norm(str(ws.getCell("B"+r).value)))){hr=r;break}}
    if(!hr)return;
    const lotNr=(/^lot\s*(\d+)/i.exec(ws.name)||[])[1];
    for(let r=hr+1;r<=ws.rowCount;r++){
      const raw=cv(ws.getCell("F"+r).value);if(raw===""||raw==null)continue;
      const v=num(raw);
      let id=str(ws.getCell("H"+r).value);
      if(!(id&&IDX[id]&&IDX[id].n.kind==="p")){
        const nr=str(ws.getCell("A"+r).value);if(!nr)continue;
        const hit=arts.find(n=>IDX[n.id].nr===nr&&(!lotNr||IDX[n.id].nr.startsWith(String(lotNr).padStart(2,"0"))));
        if(!hit)continue;id=hit.id;byNr++;
      }
      pu[id]=v;found++;
    }
  });
  if(!found)return toast("Aucun prix reconnu dans ce fichier. Il doit s'agir d'une DPGF « Entreprises » exportée par Prescrire et complétée.",6000);
  nom=nom||file.name.replace(/\.xlsx$/i,"");
  S.offres.push({id:uid(),nom,fichier:file.name,date:today(),pu});
  S.tab="off";save();setTab("off");
  toast(`Offre « ${nom} » importée : ${found} prix reconnus${byNr?` (dont ${byNr} par numéro d'article)`:""}.`,5000);
}
async function exportAnalyse(){
  if(!needLib("ExcelJS"))return;
  reindex();
  const O=S.offres,wb=new ExcelJS.Workbook(),MONEY='#,##0.00 "€"',PCT='+0.0%;-0.0%;0.0%';
  const font={name:"Arial",size:10},bold={name:"Arial",size:10,bold:true};
  const ws=wb.addWorksheet("Synthèse",{views:[{state:"frozen",ySplit:4}]});
  ws.getCell("A1").value=S.projet.nom;ws.getCell("A1").font={name:"Arial",size:14,bold:true};
  ws.getCell("A2").value="Analyse des offres · "+indTxt()+" · "+today();ws.getCell("A2").font=font;
  const hdr=["Lot","Désignation","Estimation HT",...O.flatMap(o=>[o.nom,"Écart"])];
  ws.getRow(4).values=hdr;ws.getRow(4).font=bold;
  ws.columns=[{width:8},{width:40},{width:16},...O.flatMap(()=>[{width:16},{width:9}])];
  let r=5;
  S.tree.forEach(l=>{const est=baseT(l),row=ws.getRow(r);row.values=[IDX[l.id].nr,l.nom,est,...O.flatMap(o=>covered(o,l)?[oBase(o,l),est?(oBase(o,l)-est)/est:null]:["non chiffré",null])];
    row.font=font;row.getCell(3).numFmt=MONEY;O.forEach((o,i)=>{row.getCell(4+i*2).numFmt=MONEY;row.getCell(5+i*2).numFmt=PCT});r++});
  const tr=ws.getRow(r+1);tr.values=[null,"Total HT",{formula:`SUM(C5:C${r-1})`},...O.flatMap((o,i)=>{const col=String.fromCharCode(68+i*2);return[{formula:`SUM(${col}5:${col}${r-1})`},null]})];
  tr.font=bold;tr.getCell(3).numFmt=MONEY;O.forEach((o,i)=>tr.getCell(4+i*2).numFmt=MONEY);
  const wd=wb.addWorksheet("Détail",{views:[{state:"frozen",ySplit:1}]});
  wd.getRow(1).values=["N°","Désignation","U","Qté","PU estim.",...O.flatMap(o=>["PU "+o.nom,"Écart"])];wd.getRow(1).font=bold;
  wd.columns=[{width:10},{width:46},{width:6},{width:9},{width:12},...O.flatMap(()=>[{width:14},{width:9}])];
  let k=2;
  S.tree.forEach(l=>{const lr=wd.getRow(k);lr.values=[IDX[l.id].nr,("Lot "+IDX[l.id].nr+" — "+l.nom).toUpperCase()];lr.font=bold;k++;
    flatP([l]).forEach(n=>{const ref=num(n.prix),row=wd.getRow(k);
      row.values=[IDX[n.id].nr,n.nom+(n.pse?" (PSE)":""),n.u,num(n.qte),ref,...O.flatMap(o=>{const v=o.pu[n.id];return v==null?[covered(o,l)?"manquant":"",null]:[num(v),ref?(num(v)-ref)/ref:null]})];
      row.font=font;row.getCell(5).numFmt=MONEY;O.forEach((o,i)=>{row.getCell(6+i*2).numFmt=MONEY;row.getCell(7+i*2).numFmt=PCT});k++});k++});
  await saveFile(`${slug(S.projet.nom)} - analyse des offres.xlsx`,new Blob([await wb.xlsx.writeBuffer()],{type:XLSX_MIME}));
}

/* ======================================================================
   En-tête et démarrage
   ====================================================================== */
function renderMeta(){winTitle();const m=$("#p-meta");if(!m)return;m.innerHTML=`<span class="tagphase">${esc(S.projet.phase||"")} · ind. ${esc(S.projet.indice||"A")}</span>${S.dirty?'<span class="dirty" title="Enregistrez le projet dans un fichier pour le conserver">● non enregistré</span>':S.fichier?`<span title="${esc(S.fichier)}">enregistré</span>`:""}`}
function renderHead(){$("#p-nom").value=S.projet.nom;renderMeta()}
let lastTitle="";
function winTitle(){if(!T)return;const t=`${S.fichier||S.projet.nom||"Prescrire"}${S.dirty?" •":""} — Prescrire`;if(t!==lastTitle){lastTitle=t;try{T.window.getCurrentWindow().setTitle(t)}catch(e){}}}
$("#p-nom").oninput=e=>{S.projet.nom=e.target.value;save();renderOut()};
if(!T)window.addEventListener("beforeunload",e=>{if(S&&S.dirty){e.preventDefault();e.returnValue=""}});
function boot(){reindex();recalcAll();renderHead();renderTree();$("#v-lots").setAttribute("aria-pressed",S.view==="lots");$("#v-lieux").setAttribute("aria-pressed",S.view==="lieux");setTab(S.tab||"cctp");renderFiche();persist()}
async function drainPending(){const list=await inv("take_pending").catch(()=>[]);const p=list&&list[list.length-1];if(p)guardDirty("Ouvrir",()=>openPath(p))}
async function initApp(){
  document.documentElement.classList.add("app-bureau");
  $("#b-saveas").hidden=false;
  try{
    DIRS=await inv("app_dirs");ME=await inv("whoami");CFG_PATH=pjoin(DIRS.config,"reglages.json");
    CFG=JSON.parse(await inv("read_text",{path:CFG_PATH}).catch(()=>"{}")||"{}");
    await loadSharedLib(null);
    if(S.chemin)takeLock(S.chemin);
  }catch(e){LIB_ERR=String(e);toast("Bibliothèque injoignable : "+e,8000)}
  setInterval(()=>reloadLib(false),15000);
  window.addEventListener("focus",()=>reloadLib(false));
  const w=T.window.getCurrentWindow();
  w.onCloseRequested(async ev=>{
    if(sbT){ev.preventDefault();clearTimeout(sbT);await flushBase();await releaseLock();return w.destroy()}
    if(S.dirty){ev.preventDefault();guardDirty("Quitter",async()=>{await releaseLock();S.dirty=false;await w.destroy()});return}
    await releaseLock();
  });
  T.event.listen("open-file",()=>drainPending());
  drainPending();winTitle();
}
loadAll();
boot();
if(T)initApp();
</script>
