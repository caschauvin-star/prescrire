  $("#ck-back").onclick=()=>{closeModal();back()};
  $("#ck-force").onclick=()=>{closeModal();go()};
  $("#ck-go").onclick=()=>{closeModal();go()};
}
function openAgence(){
  const A=Object.assign({nom:"",adresse:"",tel:"",mail:"",logo:"",lw:0,lh:0},getAg());
  const draw=()=>`<p class="hint" style="margin:0">Ces réglages sont propres à ${T?"ce poste":"ce navigateur"}. Ils s'impriment sur la page de garde du CCTP (Word et PDF) et remplissent le maître d'œuvre des nouveaux projets.</p>
    <div class="f"><label for="ag-nom">Nom de l'agence</label><input type="text" id="ag-nom" value="${esc(A.nom)}" placeholder="Ex. Atelier Chauvin Architecte"></div>
    <div class="f"><label for="ag-adr">Adresse</label><input type="text" id="ag-adr" value="${esc(A.adresse)}"></div>
    <div class="grid2"><div class="f"><label for="ag-tel">Téléphone</label><input type="text" id="ag-tel" value="${esc(A.tel)}"></div><div class="f"><label for="ag-mail">E-mail</label><input type="text" id="ag-mail" value="${esc(A.mail)}"></div></div>
    <div class="f"><label>Logo</label><div class="aglogo">${A.logo?`<img src="${A.logo}" alt="Logo de l'agence">`:'<span class="hint">Aucun logo</span>'}<button class="btn" id="ag-lpick">${A.logo?"Changer…":"Choisir une image…"}</button>${A.logo?'<button class="link" id="ag-ldel">retirer</button>':""}</div></div>
    <div class="f"><label for="ag-me">Votre nom <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">· ${T?"par défaut, celui de votre session":"enregistré dans ce navigateur"}, noté quand vous changez l'état d'une prestation</span></label><input type="text" id="ag-me" value="${esc(myName())}" placeholder="${T?esc(ME):"Nom ou initiales"}"></div>
    <div class="f"><label for="ag-init">Vos initiales <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">· notées devant chaque nouvelle ligne des notes internes</span></label><input type="text" id="ag-init" value="${esc(A.init||"")}" placeholder="${esc(initOf(myName())||"Ex. CC")}" maxlength="5" style="max-width:120px"></div>
    <fieldset class="agchk"><legend>Avant publication</legend>
      <label class="recap-opt"><input type="checkbox" id="ag-chkon" ${A.chkOff?"":"checked"}><span></span><span><b>Afficher la check-liste avant chaque publication</b> <small class="hint">le bouton Publier ne s'active que lorsque tout est coché</small></span><span></span></label>
      <div class="f" ${A.chkOff?'hidden':''} id="ag-chkf"><label for="ag-chk">Points à vérifier <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">· un par ligne</span></label><textarea id="ag-chk" rows="9">${esc(chkItems(A).join("\n"))}</textarea>
      <div><button class="link" id="ag-chkdef">Rétablir la liste proposée par Prescrire</button></div></div>
    </fieldset>`;
  openModal("Agence",draw(),`<button class="btn primary" data-m="close">Fermer</button>`,{focus:false});
  const bind=()=>{
    const f=(id,k)=>$(id).oninput=e=>{A[k]=e.target.value;setAg(A)};
    f("#ag-nom","nom");f("#ag-adr","adresse");f("#ag-tel","tel");f("#ag-mail","mail");
    $("#ag-me").onchange=e=>setMyName(e.target.value);
    $("#ag-init").oninput=e=>{A.init=e.target.value.trim().toUpperCase();if(!A.init)delete A.init;setAg(A);const b=$("#f-ninit");if(b)renderFiche()};
    $("#ag-chkon").onchange=e=>{if(e.target.checked)delete A.chkOff;else A.chkOff=true;setAg(A);$("#ag-chkf").hidden=!!A.chkOff};
    $("#ag-chk").oninput=e=>{A.chk=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);setAg(A)};
    $("#ag-chkdef").onclick=()=>{delete A.chk;setAg(A);$("#ag-chk").value=CHK_DEF.join("\n")};
    $("#ag-lpick").onclick=()=>pickFile(".png,.jpg,.jpeg",file=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,600/im.naturalWidth),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);A.logo=c.toDataURL("image/png");A.lw=c.width;A.lh=c.height;setAg(A);$("#m-body").innerHTML=draw();bind()};
      im.onerror=()=>toast("Image illisible.");im.src=r.result};r.readAsDataURL(file)});
    const d=$("#ag-ldel");if(d)d.onclick=()=>{A.logo="";A.lw=A.lh=0;setAg(A);$("#m-body").innerHTML=draw();bind()};
  };bind();
}

/* Annuler / rétablir : instantanés du projet (hors réglages d'affichage) */
const UIK=["sel","tab","view","lot","lieu","olot","open","filtre","dirty","fichier","chemin","finOnly"];
let HIST=[],HPOS=-1,hT=null;
function snap(){const o=Object.assign({},S);UIK.forEach(k=>delete o[k]);return JSON.stringify(o)}
function hReset(){HIST=[snap()];HPOS=0;hBtns()}
function hPush(){hT=null;const s=snap();if(s===HIST[HPOS])return;HIST=HIST.slice(0,HPOS+1);HIST.push(s);if(HIST.length>100)HIST.shift();HPOS=HIST.length-1;hBtns()}
function hBtns(){const u=$("#b-undo"),r=$("#b-redo");if(u)u.disabled=HPOS<=0;if(r)r.disabled=HPOS>=HIST.length-1}
function hGo(d){
  if(hT){clearTimeout(hT);hPush()}
  const to=HPOS+d;if(to<0||to>=HIST.length)return toast(d<0?"Rien à annuler.":"Rien à rétablir.");
  HPOS=to;const ui={};UIK.forEach(k=>ui[k]=S[k]);
  S=Object.assign(JSON.parse(HIST[HPOS]),ui);S.dirty=true;reindex();if(S.sel&&!IDX[S.sel])S.sel=S.tree[0]?S.tree[0].id:null;
  LIVE=null;persist();renderHead();renderTree();renderFiche();renderOut();hBtns();toast(d<0?"Annulé.":"Rétabli.",1200);
}
$("#b-undo").onclick=()=>hGo(-1);$("#b-redo").onclick=()=>hGo(1);

/* Contrôle avant diffusion : oublis dans les lots choisis (prévient, n'empêche pas d'exporter) */
function checkList(ids,doc,type){
  const G=[["prix","Sans prix unitaire"],["qte","Sans quantité"],["u","Sans unité"],["desc","Sans descriptif"],["etat","Pas encore validées"],["vide","Lots ou sous-lots vides"],["var","Variantes sans prestation de base remplacée"]];
  const out=Object.fromEntries(G.map(([k])=>[k,[]])),dp=doc==="dpgf";
  const it=n=>({id:n.id,nr:IDX[n.id].nr,nom:n.kind==="g"?n.nom:(ttl(n)||"Prestation sans nom")});
  const rec=arr=>arr.forEach(n=>{
    if(n.kind==="g"){if(!countP(n))out.vide.push(it(n));else rec(n.children);return}
    if(dp&&type==="moa"&&!num(n.prix))out.prix.push(it(n));
    if(dp&&!num(n.qte))out.qte.push(it(n));
    if(!(n.u||"").trim())out.u.push(it(n));
    if(!dp&&!(n.desc||"").trim()&&!clCount(n))out.desc.push(it(n));
    if((n.etat||"redaction")!=="validee")out.etat.push(it(n))});
  S.tree.filter(l=>ids.includes(l.id)).forEach(l=>{if(!countP(l))out.vide.push(it(l));else rec(l.children);
    varsOf(l).forEach(v=>{const vi=varItems(l,v);if(vi.length&&!(v.rempl||[]).length)out.var.push({id:vi[0].id,nr:IDX[l.id].nr+".V"+vNum(l,v),nom:vLabel(l,v)})})});
  return G.map(([k,l])=>[k,l,out[k]]).filter(([,,a])=>a.length);
}
function checkHTML(ids,doc,type){
  if(doc==="choix"||!ids.length)return"";
  const L=checkList(ids,doc,type),n=L.reduce((s,[,,a])=>s+a.length,0);
  if(!n)return`<div class="xcheck ok">✓ Contrôle avant diffusion : aucun oubli détecté.</div>`;
  return`<details class="xcheck"><summary>⚠ Contrôle avant diffusion : ${n} point${n>1?"s":""} à vérifier</summary>`+
    L.map(([,l,a])=>`<div class="grp"><b>${l} (${a.length})</b><ul>${a.map(x=>`<li><button data-goto="${x.id}"><span class="n">${esc(x.nr)}</span>${esc(x.nom)}</button></li>`).join("")}</ul></div>`).join("")+

}

const SEUIL=20;
const covered=(o,l)=>flatP([l]).some(n=>o.pu[n.id]!=null);
const oLine=(o,n)=>o.pu[n.id]!=null?num(o.pu[n.id])*num(n.qte):null;
const oBase=(o,l)=>flatP([l]).reduce((s,n)=>s+(n.pse||n.vid?0:(oLine(o,n)||0)),0);
const oPse=(o,l)=>flatP([l]).reduce((s,n)=>s+(n.pse&&!n.vid?(oLine(o,n)||0):0),0);
const oVarT=(o,l,v)=>varItems(l,v).reduce((s,n)=>s+(oLine(o,n)||0),0);
const oVarR=(o,l,v)=>varRempl(l,v).reduce((s,n)=>s+(oLine(o,n)||0),0);
function ecart(v,ref){if(!ref)return"";const p=(v-ref)/ref*100,c=p<-SEUIL?"lo":p>SEUIL?"hi":"eq";return`<span class="ec ${c}">${pf.format(p)} %</span>`}
function offresHTML(){
  const O=S.offres;
  let h=`<div class="out-tools" style="border-bottom:1px solid var(--line-soft)"><button class="btn primary" id="of-imp">Importer une offre…</button>
    ${O.map(o=>`<span class="offchip">${esc(o.nom)}<button data-of="${o.id}" title="Renommer ou retirer">Modifier</button></span>`).join("")}
    <span style="flex:1"></span>${O.length?'<button class="btn" id="of-exp">Exporter l\'analyse</button>':""}</div>`;
  if(!O.length)return h+`<div class="empty"><p><b>Analyse des offres</b></p><p>1. Exportez la DPGF « Entreprises » et envoyez-la aux entreprises consultées.<br>2. Quand elles vous la renvoient remplie, importez chaque fichier ici.<br>3. Prescrire compare chaque prix à votre estimation, ligne par ligne, et signale les écarts de plus de ${SEUIL} % et les prix manquants.</p></div>`;
  reindex();
  if(S.olot!=="synth"&&!IDX[S.olot])S.olot="synth";
  h+=`<div class="lotbar"><button class="chip" data-olot="synth" aria-pressed="${S.olot==="synth"}">Synthèse</button>${S.tree.map(l=>`<button class="chip" data-olot="${l.id}" aria-pressed="${S.olot===l.id}">${IDX[l.id].nr} ${esc(l.nom)}</button>`).join("")}</div>`;
  h+=`<div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Moins-disant</span><span><i style="background:var(--danger)"></i>Plus de ${SEUIL} % sous l'estimation</span><span><i style="background:var(--warn)"></i>Plus de ${SEUIL} % au-dessus</span><span><i style="background:var(--danger-soft);border:1px solid var(--danger)"></i>Prix manquant</span></div>`;
  const ths=O.map(o=>`<th class="r">${esc(o.nom)}</th>`).join("");
  if(S.olot==="synth"){
    let rows="";const tot=O.map(()=>0);let te=0;
    S.tree.forEach(l=>{const est=baseT(l);te+=est;const vals=O.map(o=>covered(o,l)?oBase(o,l):null);const ok=vals.filter(v=>v!=null);const best=ok.length?Math.min(...ok):null;
      vals.forEach((v,i)=>{if(v!=null)tot[i]+=v});
      rows+=`<tr class="art" data-olot="${l.id}"><td class="n">${IDX[l.id].nr}</td><td>${esc(l.nom)}</td><td class="r">${nf.format(est)}</td>${vals.map(v=>v==null?`<td class="r hint">non chiffré</td>`:`<td class="r ${v===best&&ok.length>1?"best":""}">${nf.format(v)}${ecart(v,est)}</td>`).join("")}</tr>`});
    const pseEst=S.tree.reduce((s,l)=>s+pseT(l),0);
    return h+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>Lot</th><th>Désignation</th><th class="r">Estimation</th>${ths}</tr></thead><tbody>${rows}
      <tr class="tot st"><td></td><td>Total HT des lots chiffrés</td><td class="r">${nf.format(te)}</td>${tot.map(v=>`<td class="r">${nf.format(v)}${ecart(v,te)}</td>`).join("")}</tr>
      ${pseEst?`<tr><td></td><td>PSE (pour mémoire)</td><td class="r">${nf.format(pseEst)}</td>${O.map(o=>`<td class="r">${nf.format(S.tree.reduce((s,l)=>s+oPse(o,l),0))}</td>`).join("")}</tr>`:""}
      </tbody></table></div><p class="hint" style="padding:0 12px 20px">Les écarts du total ne portent que sur les lots chiffrés par chaque entreprise ; comparez lot par lot si les entreprises n'ont pas répondu aux mêmes lots.</p>`;
  }
  const l=IDX[S.olot].n,cov=O.map(o=>covered(o,l));
  const row=n=>{const ref=num(n.prix),pus=O.map(o=>o.pu[n.id]!=null?num(o.pu[n.id]):null),ok=pus.filter(v=>v!=null),best=ok.length>1?Math.min(...ok):null;
    return`<tr class="art"><td class="n">${IDX[n.id].nr}</td><td>${esc(ttl(n))} ${n.pse?'<span class="pse">PSE</span>':""}<div class="hint">${qf.format(num(n.qte))} ${esc(n.u)}</div></td><td class="r">${nf.format(ref)}</td>`+
      pus.map((v,i)=>!cov[i]?`<td class="r hint">—</td>`:v==null?`<td class="miss">manquant</td>`:(()=>{const p=ref?(v-ref)/ref*100:0;return`<td class="r ${v===best?"best":""} ${p<-SEUIL?"flag-lo":p>SEUIL?"flag-hi":""}">${nf.format(v)}${ecart(v,ref)}</td>`})()).join("")+`</tr>`};
  const arts=flatP([l]);
  const base=arts.filter(n=>!n.pse&&!n.vid),pse=arts.filter(n=>n.pse&&!n.vid);
  const sg=d=>(d>=0?"+":"−")+nf.format(Math.abs(d));
  const varRows=varsOf(l).map(v=>{const it=varItems(l,v);if(!it.length)return"";
    return`<tr class="vhead"><td></td><td colspan="${2+O.length}">${esc(vLabel(l,v))}</td></tr>${it.map(row).join("")}
    <tr class="st"><td></td><td>Total variante</td><td class="r">${nf.format(varT(l,v))}</td>${O.map((o,i)=>cov[i]?`<td class="r">${nf.format(oVarT(o,l,v))}</td>`:"<td></td>").join("")}</tr>
    <tr class="pmv"><td></td><td>Plus ou moins-value</td><td class="r">${sg(varT(l,v)-varRemplT(l,v))}</td>${O.map((o,i)=>cov[i]&&it.some(n=>o.pu[n.id]!=null)?`<td class="r">${sg(oVarT(o,l,v)-oVarR(o,l,v))}</td>`:`<td class="r hint">${cov[i]?"non chiffrée":""}</td>`).join("")}</tr>`}).join("");
  const libres=O.flatMap(o=>(o.vl||[]).filter(x=>x.lot===l.id).map(x=>[o,x]));
  const libresHTML=libres.length?`<p class="lab" style="padding:14px 12px 4px;margin:0">Variantes libres proposées par les entreprises</p><div class="tblwrap"><table class="dpgf"><thead><tr><th>Entreprise</th><th>Intitulé</th><th class="r">Plus ou moins-value HT</th><th>Remarques</th></tr></thead><tbody>${libres.map(([o,x])=>`<tr><td>${esc(o.nom)}</td><td>${esc(x.nom)}</td><td class="r">${x.pmv===""||x.pmv==null?"":sg(num(x.pmv))}</td><td class="hint">${esc(x.rem||"")}</td></tr>`).join("")}</tbody></table></div>`:"";
  return h+`<div class="tblwrap"><table class="dpgf"><thead><tr><th>N°</th><th>Désignation</th><th class="r">PU estim.</th>${ths}</tr></thead><tbody>
    <tr class="lot"><td class="n">${IDX[l.id].nr}</td><td colspan="${2+O.length}">${esc(l.nom)} · prix unitaires HT</td></tr>${base.map(row).join("")}
    <tr class="st"><td></td><td>Total HT du lot</td><td class="r">${nf.format(baseT(l))}</td>${O.map((o,i)=>cov[i]?`<td class="r">${nf.format(oBase(o,l))}${ecart(oBase(o,l),baseT(l))}</td>`:`<td class="r hint">non chiffré</td>`).join("")}</tr>
    ${pse.length?`<tr class="psehead"><td></td><td colspan="${2+O.length}">Prestations supplémentaires éventuelles</td></tr>${pse.map(row).join("")}<tr class="st"><td></td><td>Total PSE</td><td class="r">${nf.format(pseT(l))}</td>${O.map((o,i)=>cov[i]?`<td class="r">${nf.format(oPse(o,l))}</td>`:`<td></td>`).join("")}</tr>`:""}
    ${varRows}
    </tbody></table></div>${libresHTML}`;
}
function bindOffres(){
  const o=$("#out");
  const imp=$("#of-imp");if(imp)imp.onclick=()=>pickFile(".xlsx",f=>importOffre(f).catch(e=>toast("Import impossible : "+(e&&e.message||e),5000)));
  const ex=$("#of-exp");if(ex)ex.onclick=()=>exportAnalyse().catch(e=>toast("Export impossible : "+(e&&e.message||e),5000));
  o.onclick=e=>{
    if(S.tab!=="off")return;
    const c=e.target.closest("[data-olot]");if(c){S.olot=c.dataset.olot;persist();renderOut();return}
    const b=e.target.closest("[data-of]");if(b)editOffre(b.dataset.of);
  };
}
function editOffre(id){
  const of=S.offres.find(x=>x.id===id);if(!of)return;
  const n=Object.keys(of.pu).length;
  of.vl=of.vl||[];
  openModal("Offre",`<div class="f"><label for="of-nom">Entreprise</label><input type="text" id="of-nom" value="${esc(of.nom)}"></div><p class="hint">Fichier : ${esc(of.fichier)} · importé le ${esc(of.date)} · ${n} prix reconnus.</p>
    <fieldset><legend>Variantes libres proposées par l'entreprise</legend><div id="of-vl" style="display:flex;flex-direction:column;gap:8px"></div>
    <div><button class="btn" id="of-vadd">+ Ajouter une variante libre</button></div></fieldset>`,
    `<button class="btn danger" id="of-del">Retirer cette offre</button><span style="flex:1"></span><button class="btn primary" data-m="close">Fermer</button>`,{onClose:()=>renderOut()});
  $("#of-nom").oninput=e=>{of.nom=e.target.value;save()};
  const drawVL=()=>{$("#of-vl").innerHTML=of.vl.map((x,i)=>`<div class="vbox"><div class="grid2"><div class="f"><label>Lot</label><select data-vlk="lot" data-i="${i}">${S.tree.map(l=>`<option value="${l.id}" ${l.id===x.lot?"selected":""}>${esc(IDX[l.id].nr+" "+l.nom)}</option>`).join("")}</select></div>
      <div class="f"><label>Plus ou moins-value HT (€)</label><input type="text" inputmode="decimal" class="numin" data-vlk="pmv" data-i="${i}" value="${esc(x.pmv===""||x.pmv==null?"":fmtIn(x.pmv))}" placeholder="ex. -1 200 ou 850"></div></div>
      <div class="f"><label>Intitulé</label><input type="text" data-vlk="nom" data-i="${i}" value="${esc(x.nom||"")}" placeholder="ex. Menuiseries mixtes bois-alu"></div>
      <div class="f"><label>Remarques</label><input type="text" data-vlk="rem" data-i="${i}" value="${esc(x.rem||"")}"></div>
      <div><button class="mini" data-vlx="${i}">Retirer</button></div></div>`).join("")||'<p class="hint" style="margin:0">Aucune. Si le règlement de consultation les autorise, notez ici les variantes proposées par l\'entreprise.</p>'};
  drawVL();reindex();
  $("#of-vadd").onclick=()=>{of.vl.push({id:uid(),lot:(S.olot&&IDX[S.olot]?S.olot:S.tree[0]&&S.tree[0].id)||"",nom:"",pmv:"",rem:""});save();drawVL()};
  $("#of-vl").oninput=$("#of-vl").onchange=e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const x=of.vl[+i],k=t.dataset.vlk;x[k]=k==="pmv"?(t.value.trim()===""?"":num(t.value)):t.value;save()};
  $("#of-vl").onclick=e=>{const b=e.target.closest("[data-vlx]");if(b){of.vl.splice(+b.dataset.vlx,1);save();drawVL()}};
  let armed=false;$("#of-del").onclick=e=>{if(!armed){armed=true;e.target.classList.add("armed");e.target.textContent="Confirmer";return}S.offres.splice(S.offres.indexOf(of),1);save();closeModal()};
}
async function importOffre(file){
  if(!needLib("ExcelJS"))return;
  reindex();
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const pu={};let nom="",found=0,byNr=0;
  const arts=flatP(S.tree);
  wb.eachSheet(ws=>{
    if(/^r[ée]cap/i.test(ws.name))return;
    for(let r=1;r<=6;r++){const a=str(ws.getCell("A"+r).value),m=/^entreprise\s*:\s*(.*)$/i.exec(a);if(m){nom=nom||m[1].trim()||str(ws.getCell("B"+r).value)||str(ws.getCell("C"+r).value)}}
    let hr=0;for(let r=1;r<=20;r++){if(/^n/i.test(norm(str(ws.getCell("A"+r).value)))&&/design/.test(norm(str(ws.getCell("B"+r).value)))){hr=r;break}}
    if(!hr)return;
    const lotNr=(/^lot\s*(\d+)/i.exec(ws.name)||[])[1];
    for(let r=hr+1;r<=ws.rowCount;r++){
      const raw=cv(ws.getCell("F"+r).value);if(raw===""||raw==null)continue;
      const v=num(raw);
      let id=str(ws.getCell("I"+r).value);
      if(!(id&&IDX[id]))id=str(ws.getCell("H"+r).value);
      if(!(id&&IDX[id]&&IDX[id].n.kind==="p")){
        const nr=str(ws.getCell("A"+r).value);if(!nr)continue;
        const hit=arts.find(n=>IDX[n.id].nr===nr&&(!lotNr||IDX[n.id].nr.startsWith(String(lotNr).padStart(2,"0"))));
        if(!hit)continue;id=hit.id;byNr++;
      }
      pu[id]=v;found++;
    }
  });
  if(!found)return toast("Aucun prix reconnu dans ce fichier. Il doit s'agir d'une DPGF « Entreprises » exportée par Prescrire et complétée.",6000);
  nom=nom||file.name.replace(/\.xlsx$/i,"");
  S.offres.push({id:uid(),nom,fichier:file.name,date:today(),pu});
  S.tab="off";save();setTab("off");
  toast(`Offre « ${nom} » importée : ${found} prix reconnus${byNr?` (dont ${byNr} par numéro d'article)`:""}.`,5000);
}
async function exportAnalyse(){
  if(!needLib("ExcelJS"))return;
  reindex();
  const O=S.offres,wb=new ExcelJS.Workbook(),MONEY='#,##0.00 "€"',PCT='+0.0%;-0.0%;0.0%';
  const font={name:"Arial",size:10},bold={name:"Arial",size:10,bold:true};
  const ws=wb.addWorksheet("Synthèse",{views:[{state:"frozen",ySplit:4}]});
  ws.getCell("A1").value=S.projet.nom;ws.getCell("A1").font={name:"Arial",size:14,bold:true};
  ws.getCell("A2").value="Analyse des offres · "+indTxt()+" · "+today();ws.getCell("A2").font=font;
  const hdr=["Lot","Désignation","Estimation HT",...O.flatMap(o=>[o.nom,"Écart"])];
  ws.getRow(4).values=hdr;ws.getRow(4).font=bold;
  ws.columns=[{width:8},{width:40},{width:16},...O.flatMap(()=>[{width:16},{width:9}])];
  let r=5;
  S.tree.forEach(l=>{const est=baseT(l),row=ws.getRow(r);row.values=[IDX[l.id].nr,l.nom,est,...O.flatMap(o=>covered(o,l)?[oBase(o,l),est?(oBase(o,l)-est)/est:null]:["non chiffré",null])];
    row.font=font;row.getCell(3).numFmt=MONEY;O.forEach((o,i)=>{row.getCell(4+i*2).numFmt=MONEY;row.getCell(5+i*2).numFmt=PCT});r++});
  const tr=ws.getRow(r+1);tr.values=[null,"Total HT",{formula:`SUM(C5:C${r-1})`},...O.flatMap((o,i)=>{const col=String.fromCharCode(68+i*2);return[{formula:`SUM(${col}5:${col}${r-1})`},null]})];
  tr.font=bold;tr.getCell(3).numFmt=MONEY;O.forEach((o,i)=>tr.getCell(4+i*2).numFmt=MONEY);
  const wd=wb.addWorksheet("Détail",{views:[{state:"frozen",ySplit:1}]});
  wd.getRow(1).values=["N°","Désignation","U","Qté","PU estim.",...O.flatMap(o=>["PU "+o.nom,"Écart"])];wd.getRow(1).font=bold;
  wd.columns=[{width:10},{width:46},{width:6},{width:9},{width:12},...O.flatMap(()=>[{width:14},{width:9}])];
  let k=2;
  S.tree.forEach(l=>{const lr=wd.getRow(k);lr.values=[IDX[l.id].nr,("Lot "+IDX[l.id].nr+" — "+l.nom).toUpperCase()];lr.font=bold;k++;
    flatP([l]).forEach(n=>{const ref=num(n.prix),row=wd.getRow(k);
      row.values=[IDX[n.id].nr,ttl(n)+(n.pse?" (PSE)":""),n.u,num(n.qte),ref,...O.flatMap(o=>{const v=o.pu[n.id];return v==null?[covered(o,l)?"manquant":"",null]:[num(v),ref?(num(v)-ref)/ref:null]})];
      row.font=font;row.getCell(5).numFmt=MONEY;O.forEach((o,i)=>{row.getCell(6+i*2).numFmt=MONEY;row.getCell(7+i*2).numFmt=PCT});k++});k++});
  await saveFile(`${slug(S.projet.nom)} - analyse des offres.xlsx`,new Blob([await wb.xlsx.writeBuffer()],{type:XLSX_MIME}));
}

/* ======================================================================
   En-tête et démarrage
   ====================================================================== */
function renderMeta(){winTitle();const m=$("#p-meta");if(!m)return;m.innerHTML=`<span class="tagphase">${esc(S.projet.phase||"")} · ind. ${esc(S.projet.indice||"A")}</span>${S.dirty?'<span class="dirty" title="Enregistrez le projet dans un fichier pour le conserver">● non enregistré</span>':S.fichier?`<span title="${esc(S.fichier)}">enregistré</span>`:""}`}
let FITC=null;
function fitPNom(){const i=$("#p-nom");if(!i)return;FITC=FITC||document.createElement("canvas").getContext("2d");const cs=getComputedStyle(i);FITC.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const w=FITC.measureText(i.value||i.placeholder).width;i.style.width=Math.ceil(w+parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+6)+"px"}
function renderHead(){$("#p-nom").value=S.projet.nom;fitPNom();renderMeta()}
let lastTitle="";
function winTitle(){if(!T)return;const t=`${S.fichier||S.projet.nom||"Prescrire"}${S.dirty?" •":""} — Prescrire`;if(t!==lastTitle){lastTitle=t;try{T.window.getCurrentWindow().setTitle(t)}catch(e){}}}
$("#p-nom").oninput=e=>{S.projet.nom=e.target.value;fitPNom();save();renderOut()};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitPNom);
if(!T)window.addEventListener("beforeunload",e=>{if(S&&S.dirty){e.preventDefault();e.returnValue=""}});
/* Colonnes : largeurs réglables, colonnes repliables ; préférences de ce poste */
const KEY_UI="prescrire-colonnes",UI_DEF={w1:300,w3:560,fold:[]};
let UI=(()=>{try{return Object.assign({},UI_DEF,JSON.parse(localStorage.getItem(KEY_UI)||"{}"))}catch(e){return{...UI_DEF}}})();
const saveUI=()=>{try{localStorage.setItem(KEY_UI,JSON.stringify(UI))}catch(e){}};
const narrow=()=>matchMedia("(max-width: 1100px)").matches;
function layoutCols(){
  const f=k=>UI.fold.includes(k),cols=$("#cols");
  [1,2,3].forEach(k=>$("#col"+k).classList.toggle("folded",f(k)));
  if(narrow()){cols.style.gridTemplateColumns="";return}
  const flex=!f(2)?2:!f(3)?3:!f(1)?1:2;
  const w=k=>f(k)?"36px":k===flex?"minmax(0,1fr)":(k===1?UI.w1:k===3?UI.w3:400)+"px";
  cols.style.gridTemplateColumns=`${w(1)} 10px ${w(2)} 10px ${w(3)}`;
  document.querySelector('[data-split="1"]').classList.toggle("off",f(1)||flex===1);
  document.querySelector('[data-split="2"]').classList.toggle("off",f(3)||flex===3);
}
function clampW(){const W=$("#cols").clientWidth||1400;UI.w1=Math.max(200,Math.min(UI.w1,W-UI.w3-360,720));UI.w3=Math.max(300,Math.min(UI.w3,W-UI.w1-360,1100))}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-fold]"),b=e.target.closest("[data-unfold]");
  if(a){const k=+a.dataset.fold;if(!UI.fold.includes(k))UI.fold.push(k);saveUI();layoutCols()}
  if(b){const k=+b.dataset.unfold;UI.fold=UI.fold.filter(x=>x!==k);saveUI();layoutCols()}
});
document.querySelectorAll(".split").forEach(sp=>{
  const which=+sp.dataset.split;
  sp.addEventListener("pointerdown",e=>{if(sp.classList.contains("off"))return;e.preventDefault();sp.setPointerCapture(e.pointerId);sp.classList.add("drag");document.body.classList.add("resizing");
    const x0=e.clientX,w10=UI.w1,w30=UI.w3;
    const mv=ev=>{const dx=ev.clientX-x0;if(which===1)UI.w1=w10+dx;else UI.w3=w30-dx;clampW();layoutCols()};
    const up=()=>{sp.classList.remove("drag");document.body.classList.remove("resizing");sp.removeEventListener("pointermove",mv);sp.removeEventListener("pointerup",up);saveUI()};
    sp.addEventListener("pointermove",mv);sp.addEventListener("pointerup",up)});
  sp.addEventListener("dblclick",()=>{UI.w1=UI_DEF.w1;UI.w3=UI_DEF.w3;clampW();saveUI();layoutCols()});
  sp.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();const d=(e.key==="ArrowRight"?16:-16);
    if(which===1)UI.w1+=d;else UI.w3-=d;clampW();saveUI();layoutCols()});
});
window.addEventListener("resize",()=>{clampW();layoutCols()});
function boot(){setTimeout(hReset,0);reindex();recalcAll();renderHead();renderTree();$("#v-lots").setAttribute("aria-pressed",S.view==="lots");$("#v-lieux").setAttribute("aria-pressed",S.view==="lieux");setTab(S.tab||"cctp");renderFiche();persist()}
async function drainPending(){const list=await inv("take_pending").catch(()=>[]);const p=list&&list[list.length-1];if(p)guardDirty("Ouvrir",()=>openPath(p))}
const vnum=v=>String(v||"").replace(/^v/i,"").split(".").map(x=>parseInt(x,10)||0);
const vNewer=(a,b)=>{const x=vnum(a),y=vnum(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0)}return false};
async function checkUpdate(){
  try{
    const cur=(T.app&&T.app.getVersion)?await T.app.getVersion():APP_VERSION;
    const r=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`,{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)return;const j=await r.json(),v=String(j.tag_name||"").replace(/^v/i,"");
    if(!v||!vNewer(v,cur))return;
    let skip="";try{skip=localStorage.getItem("prescrire-maj-ignoree")||""}catch(e){}
    if(skip===v)return;
    const b=$("#upd"),url=j.html_url||`https://github.com/${GITHUB_REPO}/releases/latest`;
    b.innerHTML=`<span><b>Prescrire ${esc(v)} est disponible</b> (vous avez la ${esc(cur)}).</span><button class="btn primary" id="upd-go">Télécharger</button><button class="link" id="upd-no">Plus tard</button>`;
    b.hidden=false;
    $("#upd-go").onclick=()=>{const o=T.opener;if(o&&o.openUrl)o.openUrl(url).catch(()=>{});else window.open(url,"_blank")};
    $("#upd-no").onclick=()=>{try{localStorage.setItem("prescrire-maj-ignoree",v)}catch(e){}b.hidden=true};
  }catch(e){}
}
async function initApp(){
  document.documentElement.classList.add("app-bureau");
  setTimeout(checkUpdate,4000);setTimeout(firstLaunch,1500);
  $("#b-saveas").hidden=false;
  try{
    DIRS=await inv("app_dirs");ME=await inv("whoami");CFG_PATH=pjoin(DIRS.config,"reglages.json");
    CFG=JSON.parse(await inv("read_text",{path:CFG_PATH}).catch(()=>"{}")||"{}");if(CFG.nom)ME=CFG.nom;
    await loadSharedLib(null);
    if(S.chemin)takeLock(S.chemin);
  }catch(e){LIB_ERR=String(e);toast("Bibliothèque injoignable : "+e,8000)}
  setInterval(()=>reloadLib(false),15000);
  window.addEventListener("focus",()=>reloadLib(false));
  const w=T.window.getCurrentWindow();
  w.onCloseRequested(async ev=>{
    if(sbT){ev.preventDefault();clearTimeout(sbT);await flushBase();await releaseLock();return w.destroy()}
    if(S.dirty){ev.preventDefault();guardDirty("Quitter",async()=>{await releaseLock();S.dirty=false;await w.destroy()});return}
    await releaseLock();
  });
  T.event.listen("open-file",()=>drainPending());
  drainPending();winTitle();
}
loadAll();
boot();
clampW();layoutCols();
if(T)initApp();
</script>
