# Fabrique les applications Mac (.dmg) et Windows (-setup.exe) à chaque envoi
# sur la branche main, ou à la demande (onglet Actions > Run workflow).
# Les fichiers sont déposés dans la page Releases, sous le numéro de version
# indiqué dans src-tauri/tauri.conf.json.
name: Fabriquer Prescrire

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/**"]
  workflow_dispatch:
    inputs:
      mac:
        description: "Machine Mac de GitHub (changer si macos-latest est saturé, ex. macos-15-intel)"
        default: macos-latest
      windows:
        description: "Fabriquer aussi la version Windows"
        type: boolean
        default: true

jobs:
  fabriquer:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [mac, windows]
        exclude:
          - os: ${{ (github.event_name == 'workflow_dispatch' && !inputs.windows) && 'windows' || 'aucun' }}
        include:
          - os: mac
            platform: ${{ inputs.mac || 'macos-latest' }}
            args: --target universal-apple-darwin
          - os: windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Prescrire v__VERSION__"
          releaseBody: "Mac : téléchargez le fichier .dmg. Windows : téléchargez le fichier se terminant par -setup.exe."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
